<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<title>星露花园 · 流光版</title>
<meta name="description" content="星露花园流光版：强化色彩渲染的三消闯关，三合一工坊与花园装扮。">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#060a14;font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#eef3ff;user-select:none}
#stage{position:fixed;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 8%,rgba(255,240,220,.10),transparent 42%),
             radial-gradient(100% 70% at 50% 118%,rgba(4,8,18,.62),transparent 62%),
             linear-gradient(180deg,rgba(4,7,16,.34),transparent 26%,transparent 76%,rgba(3,6,14,.5))}
.glass{background:linear-gradient(160deg,rgba(32,46,84,.86),rgba(15,22,42,.82));
  border:1px solid rgba(150,190,255,.22);
  box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.16)}
.btn{position:relative;border:none;border-radius:16px;padding:13px 20px;font-size:16px;font-weight:700;
  color:#08111f;letter-spacing:.5px;cursor:pointer;
  background:linear-gradient(180deg,#a9f5d0,#54d9a4 55%,#2bb07c);
  box-shadow:0 8px 20px rgba(43,176,124,.42),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(0,0,0,.18);
  transition:transform .12s ease,filter .12s ease;font-family:inherit}
.btn:active{transform:scale(.96) translateY(1px);filter:brightness(1.08)}
.btn.alt{background:linear-gradient(180deg,#ffd9a0,#ffb44d 55%,#ef8b1f);box-shadow:0 8px 20px rgba(239,139,31,.4),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:linear-gradient(180deg,rgba(120,160,230,.28),rgba(60,90,150,.24));color:#dbe9ff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 16px rgba(0,0,0,.35);border:1px solid rgba(150,190,255,.28)}
.btn[disabled]{opacity:.45;filter:grayscale(.5);pointer-events:none}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}
#ui>*{pointer-events:auto}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 74px)}
.screen.on{display:flex;animation:fadeUp .32s cubic-bezier(.2,.9,.25,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- 标题 ---------- */
#scr-title{align-items:center;justify-content:center;text-align:center;gap:8px;padding-bottom:40px}
.logo{font-size:clamp(34px,11vw,52px);font-weight:900;letter-spacing:6px;line-height:1.1;
  background:linear-gradient(180deg,#ffffff,#bfe6ff 35%,#7fc2ff 62%,#5a8ef0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(120,190,255,.65)) drop-shadow(0 6px 0 rgba(20,40,80,.6))}
.logo small{display:block;font-size:.30em;letter-spacing:12px;margin-top:14px;font-weight:700;
  background:linear-gradient(90deg,#8ff5c8,#ffe08a,#ff9ec4);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin-top:22px;font-size:13px;color:#b9cdee;letter-spacing:2px;opacity:.85}
#startBtn{margin-top:36px;padding:16px 54px;font-size:18px;border-radius:999px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 20px rgba(43,176,124,.42),0 0 0 0 rgba(90,240,180,.5),inset 0 1px 0 rgba(255,255,255,.65)}50%{box-shadow:0 8px 26px rgba(43,176,124,.6),0 0 0 14px rgba(90,240,180,0),inset 0 1px 0 rgba(255,255,255,.65)}}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);font-size:11px;color:#8ea6cc;letter-spacing:1px}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;margin-bottom:10px}
.topbar .title{font-size:16px;font-weight:800;letter-spacing:1px;flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid rgba(160,200,255,.22);color:#e8f2ff}
.chip b{color:#8ff5c8}
.ico{font-size:15px;line-height:1}

/* ---------- 花园主页 ---------- */
.hudRow{display:flex;gap:8px;flex-wrap:wrap}
.statCard{flex:1;min-width:88px;border-radius:18px;padding:11px 12px;display:flex;flex-direction:column;gap:2px}
.statCard .k{font-size:11px;color:#a8bfe0;letter-spacing:1px}
.statCard .v{font-size:20px;font-weight:900;background:linear-gradient(180deg,#fff,#9fd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.gardenWrap{flex:1;position:relative;margin-top:12px;border-radius:22px;overflow:hidden;
  border:1px solid rgba(150,190,255,.16);background:linear-gradient(180deg,rgba(20,30,55,.25),rgba(10,16,32,.45))}
.nextLevelCard{position:absolute;left:10px;right:10px;bottom:10px;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.nextLevelCard .lvl{font-size:30px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff6c9,#ffc24d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,190,70,.45))}
.nextLevelCard .info{flex:1;font-size:12px;color:#c2d6f2;line-height:1.5}
#toPlay{padding:11px 18px;border-radius:14px;font-size:15px}

/* ---------- 关卡 ---------- */
.chapter{margin:2px 0 10px;font-size:12px;letter-spacing:3px;color:#9fb6d8;font-weight:700}
.lvlGrid{flex:1;overflow-y:auto;padding-bottom:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:start}
.lvlBtn{position:relative;aspect-ratio:1;border-radius:16px;border:1px solid rgba(160,200,255,.22);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:900;font-size:19px;color:#eaf3ff;
  background:linear-gradient(180deg,rgba(70,110,190,.34),rgba(24,38,72,.5));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.35);transition:transform .12s ease}
.lvlBtn:active{transform:scale(.94)}
.lvlBtn.locked{opacity:.42;filter:grayscale(.6)}
.lvlBtn.done{background:linear-gradient(180deg,rgba(70,200,150,.42),rgba(18,70,60,.55));border-color:rgba(140,255,210,.4);
  box-shadow:0 0 16px rgba(60,220,160,.28),inset 0 1px 0 rgba(255,255,255,.24)}
.lvlBtn .stars{font-size:9px;letter-spacing:1px;color:#ffd76a;height:10px;line-height:10px}
.lvlBtn .num{font-size:19px;text-shadow:0 2px 6px rgba(0,0,0,.4)}

/* ---------- 对局 ---------- */
#scr-play{padding:calc(env(safe-area-inset-top,0px) + 8px) 10px calc(env(safe-area-inset-bottom,0px) + 8px)}
.playTop{display:flex;align-items:center;gap:8px}
.playTop .pb{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;background:linear-gradient(180deg,rgba(70,110,190,.32),rgba(20,32,60,.55));border:1px solid rgba(150,190,255,.22)}
.objRow{display:flex;gap:8px;margin:8px 0}
.objCard{flex:1;border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-width:0}
.objCard .dots{display:flex;gap:4px;flex-wrap:wrap}
.gemDot{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 2px 5px rgba(0,0,0,.4)}
.objCard .n{font-size:15px;font-weight:900}
.objCard .lab{font-size:10px;color:#a8bfe0;letter-spacing:1px}
.movesCard{align-items:center;justify-content:center;flex-direction:column;gap:0;background:none;border:none;box-shadow:none;width:74px;flex:0 0 74px}
.movesCard .mv{font-size:30px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#9fd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.movesCard .lab{font-size:10px;letter-spacing:2px}
#boardWrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
#board{display:block;border-radius:20px;touch-action:none}
.boosters{display:flex;gap:9px;justify-content:center;padding-top:4px}
.boost{position:relative;width:60px;height:58px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,rgba(70,110,190,.34),rgba(20,32,60,.6));border:1px solid rgba(150,190,255,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.3);transition:transform .12s}
.boost:active{transform:scale(.93)}
.boost .em{font-size:20px;filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
.boost .ct{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:999px;font-size:11px;font-weight:900;
  display:grid;place-items:center;background:linear-gradient(180deg,#ffd06a,#f59a20);color:#3a1d00;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.boost.armed{background:linear-gradient(180deg,rgba(120,255,200,.5),rgba(20,90,70,.6));border-color:rgba(150,255,215,.6);box-shadow:0 0 18px rgba(90,255,200,.45)}
.boost.off{opacity:.5}
.comboText{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;font-size:34px;font-weight:900;
  letter-spacing:3px;color:#fff;text-shadow:0 0 22px rgba(120,220,255,.9),0 0 46px rgba(90,140,255,.7),0 4px 0 rgba(20,40,90,.55);
  opacity:0;transform:scale(.7)}
.comboText.show{animation:comboPop .85s ease-out}
@keyframes comboPop{0%{opacity:0;transform:scale(.5) translateY(10px)}25%{opacity:1;transform:scale(1.15)}55%{transform:scale(1)}100%{opacity:0;transform:scale(1.05) translateY(-24px)}}

/* ---------- 结算 ---------- */
#scr-result{align-items:center;justify-content:center;text-align:center}
.resultCard{width:100%;max-width:360px;border-radius:26px;padding:26px 22px 22px;position:relative;overflow:hidden}
.resultCard:before{content:"";position:absolute;inset:-40% -10% auto;height:70%;
  background:radial-gradient(60% 100% at 50% 0%,rgba(140,255,210,.35),transparent 70%);pointer-events:none}
.resultCard h2{font-size:26px;letter-spacing:4px;margin-bottom:4px;
  background:linear-gradient(180deg,#fff,#9fe8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.starsBig{font-size:38px;letter-spacing:8px;color:#3a4a66;margin:10px 0 6px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.starsBig .lit{color:#ffd45e;text-shadow:0 0 20px rgba(255,200,60,.85)}
.scoreBig{font-size:42px;font-weight:900;line-height:1.1;margin:6px 0 2px;
  background:linear-gradient(180deg,#fffbe0,#ffc94d 70%,#f08a1e);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,190,70,.4))}
.rewardRow{display:flex;gap:8px;justify-content:center;margin:14px 0 6px;font-size:12px;color:#c8dcf8;flex-wrap:wrap}
.rewardRow span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid rgba(160,200,255,.2)}
.resultBtns{display:flex;gap:10px;margin-top:18px}
.resultBtns .btn{flex:1}

/* ---------- 工坊 ---------- */
.wsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:12px;border-radius:22px}
.slot{aspect-ratio:1;border-radius:14px;position:relative;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(160,200,255,.14);
  transition:transform .12s,box-shadow .15s}
.slot.sel{box-shadow:0 0 0 2px #7ef0c0 inset,0 0 16px rgba(110,240,190,.5);transform:scale(.95)}
.slot .item{width:74%;height:74%;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:900;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.5)}
.slot .lv{position:absolute;bottom:2px;right:4px;font-size:9px;font-weight:900;color:#ffe27a}
.wsTip{font-size:12px;color:#a8bfe0;text-align:center;line-height:1.6;margin:10px 0}
.meter{height:10px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0 4px}
.meter>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#6ef0c0,#ffe27a);transition:width .4s ease}

/* ---------- 花园装扮 ---------- */
.decoList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding-bottom:12px}
.deco{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:18px}
.deco .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(160,200,255,.2)}
.deco .tx{flex:1;min-width:0}
.deco .tx b{font-size:14px;display:block}
.deco .tx i{font-style:normal;font-size:11px;color:#a8bfe0}
.deco .btn{padding:8px 14px;font-size:13px;border-radius:12px}
.deco.owned .ic{background:linear-gradient(180deg,rgba(110,240,190,.34),rgba(20,90,70,.4));border-color:rgba(140,255,210,.45)}

/* ---------- 图鉴 ---------- */
.bookGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;align-content:start;padding-bottom:12px}
.bk{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:22px;position:relative;
  background:linear-gradient(180deg,rgba(70,110,190,.24),rgba(20,32,60,.4));border:1px solid rgba(150,190,255,.18)}
.bk.unk{color:#4b5f80;filter:grayscale(1)}
.bk span{position:absolute;bottom:3px;font-size:9px;color:#c9dcf7;letter-spacing:.5px}

/* ---------- 底部导航 ---------- */
#nav{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);height:60px;border-radius:20px;
  display:flex;align-items:center;padding:0 6px;z-index:5;display:none}
#nav.on{display:flex}
.navItem{flex:1;height:48px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:10px;color:#93aacb;transition:all .18s ease;letter-spacing:1px}
.navItem .em{font-size:19px;filter:grayscale(.35) opacity(.85)}
.navItem.act{color:#eaf6ff;background:linear-gradient(180deg,rgba(120,255,210,.2),rgba(90,150,255,.12));
  box-shadow:inset 0 0 0 1px rgba(150,255,220,.32),0 0 18px rgba(90,220,190,.22)}
.navItem.act .em{filter:none;transform:translateY(-1px)}
.fade{animation:fadeUp .3s ease}
::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="vignette"></div>

  <div id="ui">
    <!-- 标题 -->
    <section class="screen on" id="scr-title">
      <div class="logo">星露花园<small>流 光 版</small></div>
      <div class="tagline">三消 · 工坊 · 花园装扮</div>
      <button class="btn" id="startBtn">开 始 游 戏</button>
      <div class="hint">霓虹渲染 · 连锁爆裂 · 60帧流畅</div>
    </section>

    <!-- 花园 -->
    <section class="screen" id="scr-home">
      <div class="topbar glass">
        <div class="title">我的花园</div>
        <div class="chip"><span class="ico">⭐</span><b id="hStars">0</b></div>
        <div class="chip"><span class="ico">🪙</span><b id="hCoins">0</b></div>
      </div>
      <div class="hudRow">
        <div class="statCard glass"><div class="k">已通关卡</div><div class="v" id="hLv">0</div></div>
        <div class="statCard glass"><div class="k">装饰点</div><div class="v" id="hPts">0</div></div>
        <div class="statCard glass"><div class="k">本周最高</div><div class="v" id="hBest">0</div></div>
      </div>
      <div class="gardenWrap" id="gardenWrap">
        <div class="nextLevelCard glass">
          <div class="lvl" id="nextLv">1</div>
          <div class="info" id="nextInfo">第 1 关 · 目标：消除指定花朵</div>
          <button class="btn" id="toPlay">继续闯关</button>
        </div>
      </div>
    </section>

    <!-- 关卡选择 -->
    <section class="screen" id="scr-levels">
      <div class="topbar glass">
        <div class="title">花径关卡</div>
        <div class="chip"><span class="ico">⭐</span><b id="hStars2">0</b></div>
      </div>
      <div class="chapter" id="chapterLabel">第一章 · 露水小径</div>
      <div class="lvlGrid" id="lvlGrid"></div>
    </section>

    <!-- 工坊 -->
    <section class="screen" id="scr-workshop">
      <div class="topbar glass">
        <div class="title">花语工坊</div>
        <div class="chip"><span class="ico">✨</span><b id="hPts2">0</b> 装饰点</div>
      </div>
      <div class="wsTip">点选 3 个相同的材料可以合成更高级的材料<br>每合成一次都会产出装饰点</div>
      <div class="wsGrid glass" id="wsGrid"></div>
      <div style="margin-top:12px">
        <div class="wsTip" style="margin:0 0 6px" id="wsProgress">合成进度</div>
        <div class="meter"><i id="wsMeter" style="width:0%"></i></div>
      </div>
      <div style="display:flex;gap:9px;margin-top:auto;padding-top:12px">
        <button class="btn ghost" id="wsAdd" style="flex:1">补充材料（50 币）</button>
      </div>
    </section>

    <!-- 图鉴 / 装扮 -->
    <section class="screen" id="scr-book">
      <div class="topbar glass">
        <div class="title">花园装扮</div>
        <div class="chip"><span class="ico">✨</span><b id="hPts3">0</b></div>
      </div>
      <div class="decoList" id="decoList"></div>
    </section>

    <!-- 对局 -->
    <section class="screen" id="scr-play">
      <div class="playTop">
        <div class="pb" id="pbBack">‹</div>
        <div class="chip" style="flex:1;justify-content:center"><span class="ico">🌸</span>第 <b id="pLv">1</b> 关</div>
        <div class="pb" id="pbSound">🔊</div>
      </div>
      <div class="objRow">
        <div class="objCard glass" style="flex:1">
          <div class="dots" id="objDots"></div>
          <div style="flex:1"><div class="n" id="objNum">0</div><div class="lab" id="objLab">目标</div></div>
        </div>
        <div class="movesCard">
          <div class="mv" id="pMoves">20</div>
          <div class="lab">步 数</div>
        </div>
        <div class="objCard glass" style="flex:0 0 92px">
          <div style="flex:1"><div class="n" id="pScore">0</div><div class="lab">得分</div></div>
        </div>
      </div>
      <div id="boardWrap">
        <canvas id="board"></canvas>
        <div class="comboText" id="comboText"></div>
      </div>
      <div class="boosters" id="boosters">
        <div class="boost" data-b="0"><div class="em">🔨</div><div style="font-size:10px;color:#cfe2ff">星锤</div><div class="ct" id="bct0">3</div></div>
        <div class="boost" data-b="1"><div class="em">🌀</div><div style="font-size:10px;color:#cfe2ff">洗牌</div><div class="ct" id="bct1">1</div></div>
        <div class="boost" data-b="2"><div class="em">➕</div><div style="font-size:10px;color:#cfe2ff">加步</div><div class="ct" id="bct2">1</div></div>
      </div>
    </section>

    <!-- 结算 -->
    <section class="screen" id="scr-result">
      <div class="resultCard glass">
        <h2 id="rTitle">关卡完成</h2>
        <div class="starsBig" id="rStars">★★★</div>
        <div class="scoreBig" id="rScore">0</div>
        <div class="rewardRow" id="rReward"></div>
        <div class="resultBtns">
          <button class="btn ghost" id="rRetry">重玩</button>
          <button class="btn" id="rNext">下一关</button>
        </div>
      </div>
    </section>

    <!-- 底部导航 -->
    <nav id="nav" class="glass">
      <div class="navItem act" data-go="home"><span class="em">🌿</span>花园</div>
      <div class="navItem" data-go="levels"><span class="em">🗺️</span>闯关</div>
      <div class="navItem" data-go="workshop"><span class="em">⚗️</span>工坊</div>
      <div class="navItem" data-go="book"><span class="em">📖</span>装扮</div>
    </nav>
  </div>
</div>
<script>
"use strict";
/* =========================================================
   星露花园 · 流光版  (single-file build)
   ========================================================= */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const rnd = (a = 1, b = 0) => b + Math.random() * (a - b);
const rndi = (n) => (Math.random() * n) | 0;
const pick = (arr) => arr[(Math.random() * arr.length) | 0];

const EASE = {
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  outQuad: (t) => 1 - (1 - t) * (1 - t),
  inOutQuad: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  outBack: (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2),
  outElastic: (t) => {
    if (t === 0 || t === 1) return t;
    return Math.pow(2, -9 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1;
  },
  outBounce: (t) => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
    return n * (t -= 2.625 / d) * t + 0.984375;
  },
};

const SAVE_KEY = "slhy.glow.v1";
const DEFAULT_SAVE = {
  maxLevel: 1,
  stars: {},
  coins: 120,
  points: 0,
  best: 0,
  weekBest: 0,
  deco: [],
  ws: null,
  merges: 0,
  sound: true,
  haptic: true,
  totalCleared: 0,
};
let SAVE = loadSave();

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return { ...DEFAULT_SAVE, ws: makeInitialWorkshop() };
    const s = JSON.parse(raw);
    const out = { ...DEFAULT_SAVE, ...s };
    if (!Array.isArray(out.ws) || out.ws.length !== 16) out.ws = makeInitialWorkshop();
    return out;
  } catch (e) {
    return { ...DEFAULT_SAVE, ws: makeInitialWorkshop() };
  }
}
function persist() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE));
  } catch (e) {}
}
function makeInitialWorkshop() {
  const ws = new Array(16).fill(null);
  for (let i = 0; i < 8; i++) ws[i] = { t: i % 4, lv: 1 };
  return ws;
}

/* ---------------- 音效（WebAudio 合成，无外部资源） ---------------- */
const SFX = (() => {
  let ac = null;
  function ctx() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ac = new AC();
    }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, dur, type = "sine", gain = 0.12, slide = 0) {
    if (!SAVE.sound) return;
    const c = ctx();
    if (!c) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(gain, c.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g).connect(c.destination);
    o.start();
    o.stop(c.currentTime + dur + 0.02);
  }
  return {
    tap: () => tone(520, 0.07, "triangle", 0.06),
    pop: (i = 0) => tone(420 + i * 70, 0.16, "sine", 0.1, 220),
    swap: () => tone(360, 0.09, "sine", 0.05, 120),
    special: () => {
      tone(680, 0.22, "triangle", 0.12, 520);
      tone(980, 0.18, "sine", 0.07, 300);
    },
    win: () => {
      [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.32, "triangle", 0.1), i * 110));
    },
    lose: () => {
      [400, 330, 260].forEach((f, i) => setTimeout(() => tone(f, 0.3, "sine", 0.1), i * 130));
    },
  };
})();
function buzz(ms = 12) {
  if (!SAVE.haptic) return;
  if (navigator.vibrate) {
    try {
      navigator.vibrate(ms);
    } catch (e) {}
  }
}

const bg = $("bg");
const bgx = bg.getContext("2d", { alpha: false });
let BW = 0, BH = 0, BG_DPR = 1;
let staticLayer = null;
let sceneMode = "home";
const fireflies = [];
const petals = [];
let flySprites = null;
let petalSprites = null;
let flowerSprites = null;
let leafSprite = null;
let waterSprite = null;

function fitCanvas(c, ctx, w, h, capDpr = 2) {
  const d = Math.min(window.devicePixelRatio || 1, capDpr);
  c.width = Math.round(w * d);
  c.height = Math.round(h * d);
  c.style.width = w + "px";
  c.style.height = h + "px";
  ctx.setTransform(d, 0, 0, d, 0, 0);
  return d;
}

function buildStatic() {
  const c = document.createElement("canvas");
  c.width = Math.round(BW * BG_DPR);
  c.height = Math.round(BH * BG_DPR);
  const x = c.getContext("2d");
  x.setTransform(BG_DPR, 0, 0, BG_DPR, 0, 0);
  const W = BW, H = BH;
  const hy = H * 0.58;

  const sky = x.createLinearGradient(0, 0, 0, hy + 40);
  sky.addColorStop(0, "#0a1130");
  sky.addColorStop(0.28, "#1b2660");
  sky.addColorStop(0.55, "#4a2f74");
  sky.addColorStop(0.78, "#8c3f7c");
  sky.addColorStop(1, "#e0897d");
  x.fillStyle = sky;
  x.fillRect(0, 0, W, hy + 40);

  for (let i = 0; i < 70; i++) {
    const sx = Math.random() * W;
    const sy = Math.random() * hy * 0.85;
    const r = Math.random() * 1.3 + 0.3;
    x.globalAlpha = 0.25 + Math.random() * 0.6;
    x.fillStyle = Math.random() > 0.6 ? "#cfe4ff" : "#fff3d0";
    x.beginPath();
    x.arc(sx, sy, r, 0, TAU);
    x.fill();
  }
  x.globalAlpha = 1;

  const mx = W * 0.76, my = hy * 0.42, mr = Math.min(W, H) * 0.075;
  const glow = x.createRadialGradient(mx, my, mr * 0.3, mx, my, mr * 5.2);
  glow.addColorStop(0, "rgba(255,231,190,.95)");
  glow.addColorStop(0.16, "rgba(255,206,150,.45)");
  glow.addColorStop(0.45, "rgba(255,170,130,.14)");
  glow.addColorStop(1, "rgba(255,150,120,0)");
  x.fillStyle = glow;
  x.beginPath();
  x.arc(mx, my, mr * 5.2, 0, TAU);
  x.fill();
  x.fillStyle = "rgba(255,244,220,.98)";
  x.beginPath();
  x.arc(mx, my, mr, 0, TAU);
  x.fill();
  x.fillStyle = "rgba(255,255,255,.5)";
  x.beginPath();
  x.arc(mx - mr * 0.28, my - mr * 0.28, mr * 0.55, 0, TAU);
  x.fill();

  // 地平线暖光
  const hz = x.createRadialGradient(W * 0.5, hy, 10, W * 0.5, hy, W * 0.95);
  hz.addColorStop(0, "rgba(255,170,150,.34)");
  hz.addColorStop(0.45, "rgba(255,130,170,.14)");
  hz.addColorStop(1, "rgba(180,110,255,0)");
  x.fillStyle = hz;
  x.fillRect(0, hy - H * 0.22, W, H * 0.3);

  const hills = [
    { y: hy - H * 0.09, a: H * 0.045, c: "#33407c" },
    { y: hy - H * 0.035, a: H * 0.038, c: "#243066" },
    { y: hy + H * 0.005, a: H * 0.03, c: "#182352" },
  ];
  hills.forEach((hl, idx) => {
    x.beginPath();
    x.moveTo(-20, H);
    x.lineTo(-20, hl.y);
    const steps = 5;
    for (let i = 0; i <= steps; i++) {
      const px = -20 + ((W + 40) * i) / steps;
      const py = hl.y - Math.sin(i * 1.7 + idx * 2.1) * hl.a;
      const cpx = px - (W + 40) / steps / 2;
      const cpy = hl.y - Math.sin((i - 0.5) * 1.7 + idx * 2.1) * hl.a * 1.7;
      x.quadraticCurveTo(cpx, cpy, px, py);
    }
    x.lineTo(W + 20, H);
    x.closePath();
    x.fillStyle = hl.c;
    x.fill();
    x.strokeStyle = "rgba(140,180,255,.14)";
    x.lineWidth = 1.2;
    x.stroke();
  });

  // 近景空气光斑
  x.save();
  x.globalCompositeOperation = "lighter";
  for (let i = 0; i < 10; i++) {
    const bx = Math.random() * W;
    const by = hy + Math.random() * (H - hy) * 0.7;
    const br = 8 + Math.random() * 26;
    const bg2 = x.createRadialGradient(bx, by, 0, bx, by, br);
    const col = i % 3 === 0 ? "255,220,160" : i % 3 === 1 ? "170,255,220" : "190,180,255";
    bg2.addColorStop(0, "rgba(" + col + ",.16)");
    bg2.addColorStop(1, "rgba(" + col + ",0)");
    x.fillStyle = bg2;
    x.beginPath();
    x.arc(bx, by, br, 0, TAU);
    x.fill();
  }
  x.restore();

  const gnd = x.createLinearGradient(0, hy, 0, H);
  gnd.addColorStop(0, "#1f6353");
  gnd.addColorStop(0.35, "#154a41");
  gnd.addColorStop(1, "#0a2622");
  x.fillStyle = gnd;
  x.fillRect(0, hy, W, H - hy);

  for (let i = 0; i < 14; i++) {
    const px = Math.random() * W;
    const py = hy + Math.random() * (H - hy);
    const rr = 30 + Math.random() * 90;
    const g2 = x.createRadialGradient(px, py, 0, px, py, rr);
    g2.addColorStop(0, "rgba(110,255,200,.16)");
    g2.addColorStop(1, "rgba(80,220,170,0)");
    x.fillStyle = g2;
    x.beginPath();
    x.arc(px, py, rr, 0, TAU);
    x.fill();
  }

  x.beginPath();
  x.moveTo(W * 0.44, hy + 4);
  x.bezierCurveTo(W * 0.36, H * 0.78, W * 0.62, H * 0.86, W * 0.5, H);
  x.lineTo(W * 0.86, H);
  x.bezierCurveTo(W * 0.82, H * 0.84, W * 0.7, H * 0.72, W * 0.58, hy + 4);
  x.closePath();
  const path = x.createLinearGradient(0, hy, 0, H);
  path.addColorStop(0, "rgba(180,150,130,.20)");
  path.addColorStop(1, "rgba(120,100,90,.06)");
  x.fillStyle = path;
  x.fill();

  staticLayer = c;
}

/* ---- 精灵缓存 ---- */
function makeSprites() {
  // 萤火虫光晕
  flySprites = ["255,236,150", "160,255,210", "180,220,255"].map((rgb) => {
    const S = 64;
    const c = document.createElement("canvas");
    c.width = c.height = S;
    const x = c.getContext("2d");
    const g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    g.addColorStop(0, "rgba(" + rgb + ",1)");
    g.addColorStop(0.32, "rgba(" + rgb + ",.34)");
    g.addColorStop(1, "rgba(" + rgb + ",0)");
    x.fillStyle = g;
    x.fillRect(0, 0, S, S);
    return c;
  });
  // 花瓣
  petalSprites = ["255,170,210", "255,225,170", "200,255,235", "210,190,255"].map((rgb) => {
    const S = 32;
    const c = document.createElement("canvas");
    c.width = c.height = S;
    const x = c.getContext("2d");
    x.fillStyle = "rgba(" + rgb + ",.8)";
    x.beginPath();
    x.ellipse(S / 2, S / 2, S * 0.42, S * 0.24, 0, 0, TAU);
    x.fill();
    return c;
  });
  // 花朵（12 色）
  flowerSprites = [];
  for (let h = 0; h < 12; h++) {
    const hue = h * 30;
    const S = 96;
    const c = document.createElement("canvas");
    c.width = c.height = S;
    const x = c.getContext("2d");
    const s = 40;
    x.translate(S / 2, S * 0.9);
    x.strokeStyle = "rgba(90,190,140,.8)";
    x.lineWidth = 2.4;
    x.beginPath();
    x.moveTo(0, 0);
    x.quadraticCurveTo(s * 0.14, -s * 0.5, 0, -s * 0.95);
    x.stroke();
    const fy = -s * 0.98;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU;
      x.beginPath();
      x.ellipse(Math.cos(a) * s * 0.22, fy + Math.sin(a) * s * 0.22, s * 0.21, s * 0.135, a, 0, TAU);
      const grd = x.createLinearGradient(0, fy, Math.cos(a) * s * 0.5, fy + Math.sin(a) * s * 0.5);
      grd.addColorStop(0, "hsl(" + hue + ",95%,86%)");
      grd.addColorStop(1, "hsl(" + hue + ",88%,64%)");
      x.fillStyle = grd;
      x.fill();
    }
    x.beginPath();
    x.arc(0, fy, s * 0.12, 0, TAU);
    x.fillStyle = "rgba(255,244,190,.97)";
    x.fill();
    flowerSprites.push(c);
  }
  // 枯叶格
  leafSprite = (() => {
    const S = 96;
    const c = document.createElement("canvas");
    c.width = c.height = S;
    const x = c.getContext("2d");
    const r = 12;
    x.beginPath();
    x.moveTo(r, 2);
    x.arcTo(S - 2, 2, S - 2, S - 2, r);
    x.arcTo(S - 2, S - 2, 2, S - 2, r);
    x.arcTo(2, S - 2, 2, 2, r);
    x.arcTo(2, 2, S - 2, 2, r);
    const lg = x.createLinearGradient(0, 0, 0, S);
    lg.addColorStop(0, "rgba(70,120,70,.62)");
    lg.addColorStop(1, "rgba(28,62,40,.78)");
    x.fillStyle = lg;
    x.fill();
    x.strokeStyle = "rgba(150,230,160,.38)";
    x.lineWidth = 2;
    x.stroke();
    x.fillStyle = "rgba(150,235,160,.55)";
    for (let k = 0; k < 3; k++) {
      const a = -0.8 + k * 0.9;
      x.beginPath();
      x.ellipse(S / 2 + Math.cos(a) * S * 0.18, S / 2 + Math.sin(a) * S * 0.16, S * 0.18, S * 0.08, a, 0, TAU);
      x.fill();
    }
    return c;
  })();
}

function hasDeco(id) {
  return SAVE.deco.indexOf(id) >= 0;
}

function drawFlowerSprite(x, cx, cy, size, hueIdx, t, sway) {
  const spr = flowerSprites[hueIdx % flowerSprites.length];
  const ang = Math.sin(t * 1.4 + sway) * 0.085;
  x.save();
  x.translate(cx, cy);
  x.rotate(ang);
  x.drawImage(spr, -size / 2, -size * 0.92, size, size);
  x.restore();
}

function drawLantern(x, cx, cy, s, t, i) {
  const sway = Math.sin(t * 0.9 + i) * 0.06;
  x.save();
  x.translate(cx, cy);
  x.rotate(sway);
  x.strokeStyle = "rgba(200,220,255,.20)";
  x.lineWidth = 1;
  x.beginPath();
  x.moveTo(0, 0);
  x.lineTo(0, s * 0.9);
  x.stroke();
  x.globalCompositeOperation = "lighter";
  const g = x.createRadialGradient(0, s * 1.25, 1, 0, s * 1.25, s * 1.9);
  g.addColorStop(0, "rgba(255,190,120,.5)");
  g.addColorStop(0.5, "rgba(255,150,90,.14)");
  g.addColorStop(1, "rgba(255,120,80,0)");
  x.fillStyle = g;
  x.beginPath();
  x.arc(0, s * 1.25, s * 1.9, 0, TAU);
  x.fill();
  x.globalCompositeOperation = "source-over";
  const lg = x.createLinearGradient(0, s * 0.9, 0, s * 1.6);
  lg.addColorStop(0, "#ffd9a0");
  lg.addColorStop(0.5, "#ff9d5c");
  lg.addColorStop(1, "#e0632f");
  x.fillStyle = lg;
  x.beginPath();
  x.ellipse(0, s * 1.25, s * 0.38, s * 0.42, 0, 0, TAU);
  x.fill();
  x.strokeStyle = "rgba(255,225,180,.75)";
  x.lineWidth = 1.4;
  x.stroke();
  x.restore();
}

function drawScene(now) {
  const t = now / 1000;
  const W = BW, H = BH;
  bgx.setTransform(BG_DPR, 0, 0, BG_DPR, 0, 0);
  if (staticLayer) bgx.drawImage(staticLayer, 0, 0, W, H);
  else {
    bgx.fillStyle = "#0a0e20";
    bgx.fillRect(0, 0, W, H);
  }

  const hy = H * 0.58;
  const dim = sceneMode === "play";

  if (hasDeco("aurora")) {
    bgx.save();
    bgx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 3; i++) {
      const yy = hy * (0.22 + i * 0.16);
      const grad = bgx.createLinearGradient(0, yy - 60, 0, yy + 90);
      const h1 = i === 0 ? "120,255,200" : i === 1 ? "140,180,255" : "220,160,255";
      grad.addColorStop(0, "rgba(" + h1 + ",0)");
      grad.addColorStop(0.45, "rgba(" + h1 + "," + (dim ? 0.05 : 0.13) + ")");
      grad.addColorStop(1, "rgba(" + h1 + ",0)");
      bgx.fillStyle = grad;
      bgx.beginPath();
      bgx.moveTo(-40, yy);
      const seg = 6;
      for (let k = 0; k <= seg; k++) {
        const px = -40 + ((W + 80) * k) / seg;
        bgx.lineTo(px, yy + Math.sin(k * 0.9 + t * 0.5 + i * 2) * 26);
      }
      for (let k = seg; k >= 0; k--) {
        const px = -40 + ((W + 80) * k) / seg;
        bgx.lineTo(px, yy + 80 + Math.sin(k * 0.9 + t * 0.5 + i * 2.4) * 30);
      }
      bgx.closePath();
      bgx.fill();
    }
    bgx.restore();
  }

  if (hasDeco("whale")) {
    const wx = ((t * 22) % (W + 260)) - 130;
    const wy = hy * 0.34 + Math.sin(t * 0.7) * 12;
    bgx.save();
    bgx.translate(wx, wy);
    bgx.globalAlpha = dim ? 0.5 : 0.85;
    const wg = bgx.createLinearGradient(-40, -20, 40, 24);
    wg.addColorStop(0, "rgba(180,230,255,.95)");
    wg.addColorStop(1, "rgba(130,150,255,.5)");
    bgx.fillStyle = wg;
    bgx.beginPath();
    bgx.ellipse(0, 0, 46, 20, 0.06, 0, TAU);
    bgx.fill();
    bgx.beginPath();
    bgx.moveTo(-40, 2);
    bgx.quadraticCurveTo(-64, -14, -62, 10);
    bgx.quadraticCurveTo(-56, 16, -40, 8);
    bgx.fill();
    bgx.fillStyle = "rgba(20,30,70,.85)";
    bgx.beginPath();
    bgx.arc(26, -2, 2.2, 0, TAU);
    bgx.fill();
    bgx.restore();
    bgx.globalAlpha = 1;
  }

  if (hasDeco("arch")) {
    const ax = W * 0.5, ay = hy + 10, aw = Math.min(W * 0.44, 210), ah = Math.min(H * 0.2, 150);
    bgx.save();
    bgx.strokeStyle = "rgba(190,225,255,.34)";
    bgx.lineWidth = 3;
    bgx.beginPath();
    bgx.moveTo(ax - aw / 2, ay + ah);
    bgx.lineTo(ax - aw / 2, ay);
    bgx.quadraticCurveTo(ax, ay - ah * 0.85, ax + aw / 2, ay);
    bgx.lineTo(ax + aw / 2, ay + ah);
    bgx.stroke();
    for (let i = 0; i < 12; i++) {
      const u = i / 11;
      const px = ax - aw / 2 + aw * u;
      const py = ay - Math.sin(u * Math.PI) * ah * 0.85 + Math.sin(t * 2 + i) * 1.6;
      bgx.beginPath();
      bgx.arc(px, py, 2.4, 0, TAU);
      bgx.fillStyle = i % 2 ? "rgba(255,220,150,.9)" : "rgba(160,255,220,.9)";
      bgx.fill();
    }
    bgx.restore();
  }

  if (hasDeco("fountain")) {
    const fx0 = W * 0.2, fy0 = hy + (H - hy) * 0.42;
    bgx.save();
    bgx.fillStyle = "rgba(140,190,255,.16)";
    bgx.beginPath();
    bgx.ellipse(fx0, fy0 + 12, 46, 13, 0, 0, TAU);
    bgx.fill();
    bgx.strokeStyle = "rgba(170,215,255,.5)";
    bgx.lineWidth = 1.4;
    bgx.stroke();
    bgx.strokeStyle = "rgba(190,235,255,.55)";
    bgx.beginPath();
    for (let i = 0; i < 9; i++) {
      const u = i / 8;
      const a = -Math.PI / 2 + (u - 0.5) * 1.5;
      const sp = 26 + Math.sin(t * 1.6 + i) * 5;
      bgx.moveTo(fx0, fy0 - 6);
      bgx.quadraticCurveTo(fx0 + Math.cos(a) * sp * 0.6, fy0 - 34, fx0 + Math.cos(a) * sp, fy0 + Math.sin(a) * sp - 26);
    }
    bgx.stroke();
    bgx.restore();
  }

  if (!dim) {
    const bedY = hy + (H - hy) * 0.52;
    const n = hasDeco("flowerbed") ? 13 : 8;
    for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n;
      const px = W * (0.08 + u * 0.84) + Math.sin(i * 3.1) * 14;
      const py = bedY + Math.sin(i * 1.9) * (H - hy) * 0.18 + (i % 3) * 8;
      const size = 34 + ((i * 37) % 22);
      const hueIdx = hasDeco("flowerbed") ? (i * 5) % 12 : 10 + ((i * 3) % 2);
      drawFlowerSprite(bgx, px, py, size, hueIdx, t, i * 1.7);
    }
  }

  if (hasDeco("lanterns") && !dim) {
    for (let i = 0; i < 5; i++) drawLantern(bgx, W * (0.12 + i * 0.19), 4, 26 + (i % 2) * 8, t, i * 1.3);
  }

  bgx.save();
  bgx.globalCompositeOperation = "lighter";
  const ffCount = dim ? 8 : fireflies.length;
  for (let i = 0; i < ffCount; i++) {
    const f = fireflies[i];
    f.ph += 0.012;
    const px = f.x + Math.sin(t * f.sp + f.ph) * 26;
    const py = f.y + Math.cos(t * f.sp * 0.8 + f.ph) * 18;
    const pulse = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.6 + f.ph));
    const d = f.r * 15;
    bgx.globalAlpha = pulse * (dim ? 0.45 : 0.8);
    bgx.drawImage(flySprites[f.s], px - d / 2, py - d / 2, d, d);
  }
  bgx.restore();

  if (!dim) {
    for (const p of petals) {
      p.y += p.vy * 0.016;
      p.ph += 0.02;
      p.x += Math.sin(p.ph * p.sp) * 0.6;
      p.rot += 0.01 * p.sp;
      if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
      const s = p.r * 3;
      bgx.save();
      bgx.globalAlpha = 0.55;
      bgx.translate(p.x, p.y);
      bgx.rotate(p.rot);
      bgx.drawImage(petalSprites[p.c], -s / 2, -s / 2, s, s);
      bgx.restore();
    }
    bgx.globalAlpha = 1;
  }

  if (dim) {
    const g = bgx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "rgba(5,8,18,.64)");
    g.addColorStop(0.45, "rgba(5,8,18,.52)");
    g.addColorStop(1, "rgba(3,6,14,.74)");
    bgx.fillStyle = g;
    bgx.fillRect(0, 0, W, H);
  }
}
/* ---------------- 棋盘引擎 ---------------- */
const GEMS = [
  { hi: "#ffd3e6", mid: "#ff5f9e", lo: "#8e0f42", glyph: "heart", name: "玫瑰" },
  { hi: "#ffe3b8", mid: "#ffa53b", lo: "#8a4406", glyph: "leaf", name: "琥珀" },
  { hi: "#f6ffbe", mid: "#c9e64a", lo: "#5d7a0c", glyph: "drop", name: "青柠" },
  { hi: "#c6ffe8", mid: "#3fd8a8", lo: "#086a51", glyph: "star", name: "碧玉" },
  { hi: "#cfe0ff", mid: "#5b8cff", lo: "#16359c", glyph: "moon", name: "蓝晶" },
  { hi: "#f1d9ff", mid: "#b06bff", lo: "#4a1490", glyph: "diamond", name: "紫璃" },
];
const SP = { NONE: 0, H: 1, V: 2, BOMB: 3, RAINBOW: 4 };
let BOARD_DPR = 1;

const boardCv = $("board");
const bctx = boardCv.getContext("2d");

let spriteSize = 0;

const B = {
  W: 8, H: 8, size: 0, cell: 0, phase: "idle",

function after(sec, fn) {
