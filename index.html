}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = rndi(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* --------- 精灵预渲染：让宝石有立体光泽 --------- */
function makeGemSprites(px) {
  spriteSize = px;
  gemSprites = GEMS.map((g, gi) => {
    const c = document.createElement("canvas");
    const pad = Math.ceil(px * 0.24);
    c.width = c.height = Math.round((px + pad * 2) * BOARD_DPR);
    const x = c.getContext("2d");
    x.setTransform(BOARD_DPR, 0, 0, BOARD_DPR, 0, 0);
    const S = px, R = S / 2;
    const cx = S / 2 + pad, cy = S / 2 + pad;

    // 投影
    x.save();
    x.beginPath();
    x.ellipse(cx, cy + R * 0.78, R * 0.82, R * 0.32, 0, 0, TAU);
    x.fillStyle = "rgba(3,6,16,.5)";
    x.filter = "blur(" + (px * 0.09).toFixed(1) + "px)";
    x.fill();
    x.restore();

    // 主体
    const grd = x.createRadialGradient(cx - R * 0.36, cy - R * 0.44, R * 0.1, cx, cy, R * 1.05);
    grd.addColorStop(0, g.hi);
    grd.addColorStop(0.42, g.mid);
    grd.addColorStop(1, g.lo);
    x.beginPath();
    x.arc(cx, cy, R * 0.94, 0, TAU);
    x.fillStyle = grd;
    x.fill();

    // 底部反射光
    const bot = x.createRadialGradient(cx + R * 0.2, cy + R * 0.5, R * 0.05, cx + R * 0.1, cy + R * 0.55, R * 0.85);
    bot.addColorStop(0, "rgba(255,255,255,.34)");
    bot.addColorStop(1, "rgba(255,255,255,0)");
    x.beginPath();
    x.arc(cx, cy, R * 0.94, 0, TAU);
    x.fillStyle = bot;
    x.fill();

    // 边缘
    x.lineWidth = Math.max(1, px * 0.055);
    x.strokeStyle = "rgba(255,255,255,.5)";
    x.beginPath();
    x.arc(cx, cy, R * 0.9, Math.PI * 0.9, Math.PI * 1.75);
    x.stroke();
    x.lineWidth = Math.max(1, px * 0.045);
    x.strokeStyle = "rgba(0,0,0,.28)";
    x.beginPath();
    x.arc(cx, cy, R * 0.93, Math.PI * 0.02, Math.PI * 0.72);
    x.stroke();

    // 高光
    x.beginPath();
    x.ellipse(cx - R * 0.3, cy - R * 0.4, R * 0.34, R * 0.2, -0.6, 0, TAU);
    const spec = x.createLinearGradient(cx - R * 0.6, cy - R * 0.6, cx - R * 0.1, cy - R * 0.15);
    spec.addColorStop(0, "rgba(255,255,255,.98)");
    spec.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = spec;
    x.fill();

    // 花纹
    drawGlyph(x, g.glyph, cx, cy, R * 0.52);
    return c;
  });
}

function drawGlyph(x, kind, cx, cy, r) {
  x.save();
  x.translate(cx, cy);
  x.fillStyle = "rgba(255,255,255,.5)";
  x.strokeStyle = "rgba(255,255,255,.5)";
  x.lineWidth = Math.max(1, r * 0.22);
  x.lineCap = "round";
  x.beginPath();
  if (kind === "heart") {
    x.moveTo(0, r * 0.75);
    x.bezierCurveTo(-r * 1.15, -r * 0.1, -r * 0.5, -r * 1.0, 0, -r * 0.42);
    x.bezierCurveTo(r * 0.5, -r * 1.0, r * 1.15, -r * 0.1, 0, r * 0.75);
    x.fill();
  } else if (kind === "leaf") {
    x.moveTo(-r * 0.7, r * 0.7);
    x.bezierCurveTo(-r * 0.9, -r * 0.7, r * 0.6, -r * 0.9, r * 0.75, -r * 0.7);
    x.bezierCurveTo(r * 0.9, r * 0.6, -r * 0.3, r * 0.95, -r * 0.7, r * 0.7);
    x.fill();
    x.strokeStyle = "rgba(255,255,255,.35)";
    x.lineWidth = Math.max(0.8, r * 0.12);
    x.beginPath();
    x.moveTo(-r * 0.55, r * 0.55);
    x.lineTo(r * 0.5, -r * 0.5);
    x.stroke();
  } else if (kind === "drop") {
    x.moveTo(0, -r * 0.95);
    x.bezierCurveTo(r * 0.85, -r * 0.1, r * 0.62, r * 0.9, 0, r * 0.9);
    x.bezierCurveTo(-r * 0.62, r * 0.9, -r * 0.85, -r * 0.1, 0, -r * 0.95);
    x.fill();
  } else if (kind === "star") {
    for (let i = 0; i < 5; i++) {
      const a1 = -Math.PI / 2 + (i / 5) * TAU;
      const a2 = a1 + TAU / 10;
      x.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
      x.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45);
    }
    x.closePath();
    x.fill();
  } else if (kind === "moon") {
    x.arc(0, 0, r * 0.85, 0, TAU);
    x.fill();
    x.globalCompositeOperation = "destination-out";
    x.beginPath();
    x.arc(r * 0.42, -r * 0.28, r * 0.7, 0, TAU);
    x.fill();
  } else {
    x.moveTo(0, -r);
    x.lineTo(r * 0.78, 0);
    x.lineTo(0, r);
    x.lineTo(-r * 0.78, 0);
    x.closePath();
    x.fill();
  }
  x.restore();
}

/* --------- 关卡配置 --------- */
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const CHAPTERS = ["露水小径", "萤火溪谷", "月光花庭", "星辉回廊", "极光之巅"];

function levelCfg(n) {
  const R = mulberry(n * 7919 + 17);
  const size = n <= 4 ? 7 : n <= 24 ? 8 : 9;
  const colors = n <= 3 ? 5 : 6;
  const kindIdx = n % 3;
  const kind = kindIdx === 0 ? "collect" : kindIdx === 1 ? "leaf" : "score";
  const moves = 22 + (size - 7) * 2 + (n % 6 === 0 ? 2 : 0);
  const cfg = { n, size, colors, kind, moves, target: 0, colors2: [], needs: [], leaves: 0 };
  if (kind === "collect") {
    const two = n >= 6 && n % 4 !== 1;
    const c1 = Math.floor(R() * colors);
    let c2 = (c1 + 1 + Math.floor(R() * (colors - 1))) % colors;
    const base = Math.round(8 + n * 1.15);
    cfg.colors2 = two ? [c1, c2] : [c1];
    cfg.needs = two ? [base, Math.round(base * 0.7)] : [Math.round(base * 1.2)];
    cfg.target = 800 + n * 170;
  } else if (kind === "leaf") {
    cfg.leaves = Math.min(22, Math.round(8 + n * 0.42));
    cfg.target = 900 + n * 180;
  } else {
    cfg.target = 900 + n * 190;
  }
  cfg.star2 = Math.round(cfg.target * 1.0);
  cfg.star3 = Math.round(cfg.target * 1.42);
  return cfg;
}

/* --------- 棋盘：初始化与几何 --------- */
function cellCX(x) { return B.pad + (x + 0.5) * B.cell; }
function cellCY(y) { return B.pad + (y + 0.5) * B.cell; }

function layoutBoard() {
  const wrap = $("boardWrap");
  const availW = wrap.clientWidth || window.innerWidth - 20;
  const availH = wrap.clientHeight || window.innerHeight * 0.52;
  const S = Math.floor(Math.min(availW, availH) - 4);
  B.size = S;
  B.pad = Math.round(S * 0.035);
  B.cell = (S - B.pad * 2) / B.W;
  BOARD_DPR = fitCanvas(boardCv, bctx, S, S, 2);
  makeGemSprites(Math.round(B.cell * 0.86));
  buildPanel();
}

function buildPanel() {
  const S = B.size;
  const c = document.createElement("canvas");
  c.width = Math.round(S * BOARD_DPR);
  c.height = Math.round(S * BOARD_DPR);
  const x = c.getContext("2d");
  x.setTransform(BOARD_DPR, 0, 0, BOARD_DPR, 0, 0);
  const R = S * 0.06;
  // 外发光
  x.save();
  x.shadowColor = "rgba(90,150,255,.55)";
  x.shadowBlur = S * 0.06;
  x.beginPath();
  roundRect(x, 1, 1, S - 2, S - 2, R);
  const panel = x.createLinearGradient(0, 0, S, S);
  panel.addColorStop(0, "rgba(30,44,80,.92)");
  panel.addColorStop(0.5, "rgba(16,24,48,.93)");
  panel.addColorStop(1, "rgba(26,32,66,.94)");
  x.fillStyle = panel;
  x.fill();
  x.restore();
  // 内高光
  x.strokeStyle = "rgba(170,205,255,.28)";
  x.lineWidth = 1.5;
  x.beginPath();
  roundRect(x, 1, 1, S - 2, S - 2, R);
  x.stroke();
  // 格槽
  const g = B.cell * 0.07;
  for (let y = 0; y < B.H; y++) {
    for (let x2 = 0; x2 < B.W; x2++) {
      const cx = B.pad + x2 * B.cell + g;
      const cy = B.pad + y * B.cell + g;
      const s = B.cell - g * 2;
      x.beginPath();
      roundRect(x, cx, cy, s, s, s * 0.22);
      x.fillStyle = "rgba(255,255,255,.042)";
      x.fill();
      x.strokeStyle = "rgba(255,255,255,.05)";
      x.lineWidth = 1;
      x.stroke();
    }
  }
  B.panel = c;
}

function roundRect(x, px, py, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  x.beginPath();
  x.moveTo(px + r, py);
  x.lineTo(px + w - r, py);
  x.quadraticCurveTo(px + w, py, px + w, py + r);
  x.lineTo(px + w, py + h - r);
  x.quadraticCurveTo(px + w, py + h, px + w - r, py + h);
  x.lineTo(px + r, py + h);
  x.quadraticCurveTo(px, py + h, px, py + h - r);
  x.lineTo(px, py + r);
  x.quadraticCurveTo(px, py, px + r, py);
  x.closePath();
}

function makeTile(t, sp) {
  return {
    id: B.nextId++, t, sp: sp || 0,
    gx: 0, gy: 0, px: 0, py: 0, sc: 1, born: 0,
  };
}

function typeAt(x, y) {
  const tl = B.grid[y * B.W + x];
  return tl ? tl.t : -1;
}

function freeType(x, y, maxT) {
  for (let tries = 0; tries < 24; tries++) {
    const t = rndi(maxT);
    if (x >= 2 && typeAt(x - 1, y) === t && typeAt(x - 2, y) === t) continue;
    if (y >= 2 && typeAt(x, y - 1) === t && typeAt(x, y - 2) === t) continue;
    return t;
  }
  return rndi(maxT);
}

function boardStart(level) {
  B.level = level;
  B.cfg = levelCfg(level);
  B.W = B.H = B.cfg.size;
  B.grid = new Array(B.W * B.H).fill(null);
  B.leaves = new Array(B.W * B.H).fill(0);
  B.cleared = {};
  B.combo = 0;
  B.score = 0;
  B.moves = B.cfg.moves;
  B.phase = "idle";
  B.sel = -1;
  B.armed = -1;
  B.jobs.length = 0;
  B.fx.length = 0;
  B.time = 0;
  B.shake = 0;
  B.hintT = 0;
  B.hintCell = -1;
  B.lastSwap = [];

  const maxT = B.cfg.colors;
  for (let y = 0; y < B.H; y++) {
    for (let x = 0; x < B.W; x++) {
      const i = y * B.W + x;
      const tl = makeTile(freeType(x, y, maxT));
      tl.gx = x; tl.gy = y;
      B.grid[i] = tl;
    }
  }
  // 枯叶
  let placed = 0;
  B.leavesTotal = 0;
  if (B.cfg.kind === "leaf") {
    const cells = [];
    for (let i = 0; i < B.W * B.H; i++) cells.push(i);
    shuffle(cells);
    for (const i of cells) {
      const y = (i / B.W) | 0;
      if (y < 1) continue;
      B.leaves[i] = 1;
      placed++;
      B.leavesTotal++;
      if (placed >= B.cfg.leaves) break;
    }
  }
  B.leavesLeft = B.leavesTotal;

  layoutBoard();
  // 初始位置
  for (let y = 0; y < B.H; y++) {
    for (let x = 0; x < B.W; x++) {
      const tl = B.grid[y * B.W + x];
      tl.px = cellCX(x); tl.py = cellCY(y);
    }
  }
  B.obj = { kind: B.cfg.kind, done: B.cfg.kind === "score" ? 0 : 0 };
  renderObjective();
  updatePlayHUD();
  // 保证开局有可走步
  ensurePlayable();
}

/* --------- 匹配检测 --------- */
function findRuns() {
  const W = B.W, H = B.H, groups = [];
  for (let y = 0; y < H; y++) {
    let x = 0;
    while (x < W) {
      const t = typeAt(x, y);
      if (t < 0) { x++; continue; }
      let e = x + 1;
      while (e < W && typeAt(e, y) === t) e++;
      if (e - x >= 3) {
        const cells = [];
        for (let k = x; k < e; k++) cells.push(y * W + k);
        groups.push({ dir: "h", t, cells, len: e - x });
      }
      x = e;
    }
  }
  for (let x = 0; x < W; x++) {
    let y = 0;
    while (y < H) {
      const t = typeAt(x, y);
      if (t < 0) { y++; continue; }
      let e = y + 1;
      while (e < H && typeAt(x, e) === t) e++;
      if (e - y >= 3) {
        const cells = [];
        for (let k = y; k < e; k++) cells.push(k * W + x);
        groups.push({ dir: "v", t, cells, len: e - y });
      }
      y = e;
    }
  }
  return groups;
}

function buildClusters(groups) {
  const n = groups.length;
  if (!n) return [];
  const parent = new Array(n).fill(0).map((_, i) => i);
  const find = (i) => (parent[i] === i ? i : (parent[i] = find(parent[i])));
  const owner = new Map();
  groups.forEach((g, gi) => {
    g.cells.forEach((c) => {
      if (owner.has(c)) {
        const p = find(gi), q = find(owner.get(c));
        if (p !== q) parent[p] = q;
      } else owner.set(c, gi);
    });
  });
  const map = new Map();
  groups.forEach((g, gi) => {
    const r = find(gi);
    if (!map.has(r)) map.set(r, { cells: new Set(), groups: [], t: g.t, maxLen: 0, hasH: false, hasV: false, best: null });
    const cl = map.get(r);
    g.cells.forEach((c) => cl.cells.add(c));
    cl.groups.push(g);
    cl.maxLen = Math.max(cl.maxLen, g.len);
    cl.hasH = cl.hasH || g.dir === "h";
    cl.hasV = cl.hasV || g.dir === "v";
    if (!cl.best || g.len > cl.best.len) cl.best = g;
  });
  return [...map.values()];
}

/* --------- 特殊宝石 --------- */
function expandSpecials(seed) {
  const done = new Set();
  const q = [...seed];
  let guard = 0;
  while (q.length && guard++ < 4000) {
    const i = q.pop();
    if (done.has(i)) continue;
    done.add(i);
    const tl = B.grid[i];
    if (!tl || !tl.sp) continue;
    const x = i % B.W, y = (i / B.W) | 0;
    if (tl.sp === SP.H) {
      for (let k = 0; k < B.W; k++) q.push(y * B.W + k);
      addLineFx(x, y, true);
    } else if (tl.sp === SP.V) {
      for (let k = 0; k < B.H; k++) q.push(k * B.W + x);
      addLineFx(x, y, false);
    } else if (tl.sp === SP.BOMB) {
      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < B.W && ny >= 0 && ny < B.H) q.push(ny * B.W + nx);
        }
      addRingFx(cellCX(x), cellCY(y), B.cell * 1.9, "255,220,140");
    } else if (tl.sp === SP.RAINBOW) {
      const counts = {};
      for (let k = 0; k < B.grid.length; k++) {
        const o = B.grid[k];
        if (o) counts[o.t] = (counts[o.t] || 0) + 1;
      }
      let best = 0, bc = -1;
      for (const k in counts) if (counts[k] > bc) { bc = counts[k]; best = +k; }
      for (let k = 0; k < B.grid.length; k++) {
        const o = B.grid[k];
        if (o && o.t === best) q.push(k);
      }
      addRingFx(cellCX(x), cellCY(y), B.cell * 3.4, "255,255,255");
      B.shake = Math.max(B.shake, 0.5);
    }
  }
  return done;
}

function clearCluster(cl, mult) {
  // 1) 决定生成的特殊宝石
  const created = [];
  if (cl.maxLen >= 5) {
    const p = choosePivot(cl);
    created.push({ idx: p, sp: SP.RAINBOW });
  } else if (cl.hasH && cl.hasV) {
    const p = choosePivot(cl);
    created.push({ idx: p, sp: SP.BOMB });
  } else if (cl.maxLen === 4) {
    const p = choosePivot(cl);
    created.push({ idx: p, sp: cl.best.dir === "h" ? SP.H : SP.V });
  }

  const seed = new Set(cl.cells);
  created.forEach((c) => seed.delete(c.idx));
  const toClear = expandSpecials(seed);

  let gained = 0;
  for (const i of toClear) {
    const tl = B.grid[i];
    if (!tl) continue;
    const x = i % B.W, y = (i / B.W) | 0;
    gained += 10;
    B.cleared[tl.t] = (B.cleared[tl.t] || 0) + 1;
    SAVE.totalCleared++;
    if (B.leaves[i] > 0) {
      B.leaves[i] = 0;
      B.leavesLeft = Math.max(0, B.leavesLeft - 1);
      addLeafFx(cellCX(x), cellCY(y));
      gained += 30;
    }
    burst(cellCX(x), cellCY(y), tl.t, tl.sp);
    B.grid[i] = null;
  }
  B.score += Math.round(gained * mult);

  // 2) 生成特殊宝石
  created.forEach((c) => {
    const tl = makeTile(cl.t, c.sp);
    tl.gx = c.idx % B.W; tl.gy = (c.idx / B.W) | 0;
    tl.px = cellCX(tl.gx); tl.py = cellCY(tl.gy);
    tl.born = B.time;
    tl.sc = 0.2;
    B.grid[c.idx] = tl;
    addRingFx(tl.px, tl.py, B.cell * 1.2, "255,255,255");
    SFX.special();
  });

  if (toClear.size >= 6) B.shake = Math.max(B.shake, Math.min(0.9, toClear.size / 26));
  SFX.pop(Math.min(6, toClear.size));
  updatePlayHUD();
}

function choosePivot(cl) {
  for (const s of B.lastSwap) if (cl.cells.has(s)) return s;
  const arr = [...cl.cells];
  const g = cl.best;
  return g.cells[(g.cells.length / 2) | 0] || arr[(arr.length / 2) | 0];
}

/* --------- 掉落 --------- */
function refill() {
  for (let x = 0; x < B.W; x++) {
    let writeY = B.H - 1;
    for (let y = B.H - 1; y >= 0; y--) {
      const i = y * B.W + x;
      if (B.grid[i]) {
        if (writeY !== y) {
          const tl = B.grid[i];
          B.grid[writeY * B.W + x] = tl;
          B.grid[i] = null;
          tl.gy = writeY;
          tl.gx = x;
        }
        writeY--;
      }
    }
    let above = 0;
    for (let y = writeY; y >= 0; y--) {
      const i = y * B.W + x;
      const tl = makeTile(freeType(x, y, B.cfg.colors));
      tl.gx = x; tl.gy = y;
      tl.px = cellCX(x);
      tl.py = cellCY(0) - (above + 1) * B.cell;
      tl.born = B.time;
      above++;
      B.grid[i] = tl;
    }
  }
}

/* --------- 回合推进 --------- */
function resolveBoard() {
  const groups = findRuns();
  if (!groups.length) {
    B.phase = "idle";
    B.combo = 0;
    updatePlayHUD();
    if (checkWin()) return;
    if (B.moves <= 0) return loseLevel();
    ensurePlayable();
    return;
  }
  B.combo++;
  const mult = 1 + (B.combo - 1) * 0.5;
  if (B.combo >= 2) showCombo(B.combo, mult);
  const clusters = buildClusters(groups);
  clusters.forEach((cl) => clearCluster(cl, mult));
  after(0.12, () => {
    refill();
    after(0.2, resolveBoard);
  });
}

function attemptSwap(a, b) {
  if (B.phase !== "idle") return false;
  const ax = a % B.W, ay = (a / B.W) | 0;
  const bx = b % B.W, by = (b / B.W) | 0;
  if (Math.abs(ax - bx) + Math.abs(ay - by) !== 1) return false;
  const ta = B.grid[a], tb = B.grid[b];
  if (!ta || !tb) return false;
  if (ta.sp && tb.sp) {
    // 双特殊宝石组合：一起引爆
    B.phase = "busy";
    B.grid[a] = tb; B.grid[b] = ta;
    ta.gx = bx; ta.gy = by; tb.gx = ax; tb.gy = ay;
    B.lastSwap = [a, b];
    B.moves--;
    B.shake = 1;
    SFX.special();
    buzz(24);
    const seed = new Set([a, b]);
    const done = expandSpecials(seed);
    done.forEach((k) => {
      const o = B.grid[k];
      if (!o) return;
      B.cleared[o.t] = (B.cleared[o.t] || 0) + 1;
      if (B.leaves[k]) { B.leaves[k] = 0; B.leavesLeft = Math.max(0, B.leavesLeft - 1); }
      burst(cellCX(k % B.W), cellCY((k / B.W) | 0), o.t, o.sp);
      B.grid[k] = null;
    });
    B.score += done.size * 18;
    showCombo(3, 2);
    updatePlayHUD();
    after(0.18, () => { refill(); after(0.3, resolveBoard); });
    return true;
  }

  if (ta.sp === SP.RAINBOW || tb.sp === SP.RAINBOW) {
    B.phase = "busy";
    B.grid[a] = tb; B.grid[b] = ta;
    ta.gx = bx; ta.gy = by; tb.gx = ax; tb.gy = ay;
    B.lastSwap = [a, b];
    const rainbow = ta.sp === SP.RAINBOW ? a : b;
    const other = rainbow === a ? b : a;
    const otherTile = B.grid[other];
    const t = otherTile ? otherTile.t : rndi(B.cfg.colors);
    B.grid[rainbow].sp = 0;
    const seed = new Set([rainbow]);
    for (let k = 0; k < B.grid.length; k++) {
      const o = B.grid[k];
      if (o && o.t === t) seed.add(k);
    }
    const done = expandSpecials(seed);
    SFX.special();
    done.forEach((i) => {
      const o = B.grid[i];
      if (!o) return;
      B.cleared[o.t] = (B.cleared[o.t] || 0) + 1;
      if (B.leaves[i]) { B.leaves[i] = 0; B.leavesLeft = Math.max(0, B.leavesLeft - 1); }
      burst(cellCX(i % B.W), cellCY((i / B.W) | 0), o.t, o.sp);
      B.grid[i] = null;
    });
    B.score += done.size * 14;
    B.moves--;
    B.shake = 0.7;
    updatePlayHUD();
    after(0.22, () => { refill(); after(0.34, resolveBoard); });
    return true;
  }

  B.phase = "swap";
  B.grid[a] = tb;
  B.grid[b] = ta;
  ta.gx = bx; ta.gy = by;
  tb.gx = ax; tb.gy = ay;
  B.lastSwap = [a, b];
  SFX.swap();
  after(0.12, () => {
    const groups = findRuns();
    if (!groups.length) {
      // 回退
      B.grid[a] = ta;
      B.grid[b] = tb;
      ta.gx = ax; ta.gy = ay;
      tb.gx = bx; tb.gy = by;
      SFX.tap();
      after(0.16, () => { B.phase = "idle"; });
    } else {
      B.moves--;
      B.phase = "busy";
      B.combo = 0;
      B.hintCell = -1;
      B.hintT = 0;
      updatePlayHUD();
      after(0.06, resolveBoard);
    }
  });
  return true;
}

function checkWin() {
  const cfg = B.cfg;
  let ok = false;
  if (cfg.kind === "score") ok = B.score >= cfg.target;
  else if (cfg.kind === "leaf") ok = B.leavesLeft <= 0;
  else {
    ok = true;
    for (let k = 0; k < cfg.colors2.length; k++) {
      if ((B.cleared[cfg.colors2[k]] || 0) < cfg.needs[k]) ok = false;
    }
  }
  if (ok) {
    B.phase = "won";
    SFX.win();
    buzz(30);
    after(0.45, () => finishLevel(true));
    return true;
  }
  return false;
}

function loseLevel() {
  if (B.phase === "won" || B.phase === "lost") return;
  B.phase = "lost";
  SFX.lose();
  after(0.4, () => finishLevel(false));
}

/* --------- 可走步检测 --------- */
function hasMove() {
  for (let i = 0; i < B.grid.length; i++) {
    const x = i % B.W, y = (i / B.W) | 0;
    const tryPair = (j) => {
      const ta = B.grid[i], tb = B.grid[j];
      if (!ta || !tb) return false;
      B.grid[i] = tb; B.grid[j] = ta;
      const ok = findRuns().length > 0;
      B.grid[i] = ta; B.grid[j] = tb;
      return ok;
    };
    if (x + 1 < B.W && tryPair(i + 1)) return i;
    if (y + 1 < B.H && tryPair(i + B.W)) return i;
  }
  return -1;
}

function findHint() {
  for (let i = 0; i < B.grid.length; i++) {
    const x = i % B.W, y = (i / B.W) | 0;
    const test = (j) => {
      const ta = B.grid[i], tb = B.grid[j];
      if (!ta || !tb) return false;
      B.grid[i] = tb; B.grid[j] = ta;
      const ok = findRuns().length > 0;
      B.grid[i] = ta; B.grid[j] = tb;
      return ok;
    };
    if (x + 1 < B.W && test(i + 1)) return [i, i + 1];
    if (y + 1 < B.H && test(i + B.W)) return [i, i + B.W];
  }
  return null;
}

function ensurePlayable() {
  let guard = 0;
  while (!hasMove() && guard++ < 12) {
    for (let i = 0; i < B.grid.length; i++) {
      const tl = B.grid[i];
      if (!tl) continue;
      tl.t = rndi(B.cfg.colors);
      tl.born = B.time;
      tl.sc = 0.6;
    }
    // 破除直接三连
    let g2 = 0;
    while (findRuns().length && g2++ < 40) {
      const groups = findRuns();
      const g = groups[0];
      const idx = g.cells[rndi(g.cells.length)];
      const tl = B.grid[idx];
      if (tl) tl.t = (tl.t + 1 + rndi(B.cfg.colors - 1)) % B.cfg.colors;
    }
  }
}
/* --------- 特效 --------- */
B.fx = [];
let gemPad = 0;

function addFx(o) {
  if (B.fx.length > 340) return;
  o.t = 0;
  B.fx.push(o);
}
function addRingFx(x, y, r, rgb) {
  addFx({ k: "r", x, y, r0: r * 0.18, r1: r, rgb, life: 0.45 });
}
function addLineFx(x, y, horiz) {
  addFx({ k: "l", x, y, horiz, life: 0.32 });
}
function addLeafFx(x, y) {
  for (let i = 0; i < 7; i++) {
    addFx({
      k: "p", x, y, vx: rnd(120, -120), vy: rnd(-60, -180), g: 380,
      life: rnd(0.7, 0.45), size: rnd(6, 3), rot: rnd(TAU), rgb: "110,220,140", sq: true,
    });
  }
  addRingFx(x, y, B.cell * 1.1, "120,240,160");
}
function burst(x, y, type, sp) {
  const g = GEMS[type] || GEMS[0];
  const n = sp ? 12 : 7;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU;
    const sp2 = rnd(sp ? 320 : 210, 40);
    addFx({
      k: "p", x, y, vx: Math.cos(a) * sp2, vy: Math.sin(a) * sp2 - 40, g: 470,
      life: rnd(0.62, 0.34), size: rnd(sp ? 7 : 4.6, 2.2), rot: rnd(TAU),
      rgb: i % 3 === 0 ? "255,255,255" : g.mid.replace("#", "").match(/../g).map((h) => parseInt(h, 16)).join(","),
      sq: i % 2 === 0,
    });
  }
  addRingFx(x, y, B.cell * (sp ? 1.5 : 0.9), i2rgb(g.mid));
}
function i2rgb(hex) {
  const m = hex.replace("#", "").match(/../g);
  return m.map((h) => parseInt(h, 16)).join(",");
}
function updateFx(dt) {
  for (let i = B.fx.length - 1; i >= 0; i--) {
    const f = B.fx[i];
    f.t += dt;
    if (f.t >= f.life) {
      B.fx.splice(i, 1);
      continue;
    }
    if (f.k === "p") {
      f.vy += (f.g || 400) * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.rot += dt * 6;
    }
  }
}

/* --------- 棋盘绘制 --------- */
function drawBoard(now) {
  const t = now / 1000;
  const S = B.size;
  bctx.setTransform(BOARD_DPR, 0, 0, BOARD_DPR, 0, 0);
  bctx.clearRect(0, 0, S, S);

  bctx.save();
  if (B.shake > 0) {
    const k = B.shake * B.shake * 7;
    bctx.translate(rnd(k, -k), rnd(k, -k));
  }

  if (B.panel) bctx.drawImage(B.panel, 0, 0, S, S);

  // 棋盘内容裁剪
  bctx.save();
  bctx.beginPath();
  roundRect(bctx, 1, 1, S - 2, S - 2, S * 0.06);
  bctx.clip();

  // 枯叶底纹（精灵缓存）
  if (leafSprite) {
    for (let i = 0; i < B.leaves.length; i++) {
      if (!B.leaves[i]) continue;
      const x = i % B.W, y = (i / B.W) | 0;
      const s = B.cell * 0.94;
      bctx.drawImage(leafSprite, cellCX(x) - s / 2, cellCY(y) - s / 2, s, s);
    }
  }

  // 选中框
  if (B.sel >= 0 && B.grid[B.sel]) {
    const x = B.sel % B.W, y = (B.sel / B.W) | 0;
    const cx = cellCX(x), cy = cellCY(y);
    const s = B.cell * 0.94;
    bctx.save();
    bctx.translate(cx, cy);
    bctx.strokeStyle = "rgba(150,255,230," + (0.55 + 0.35 * Math.sin(t * 6)) + ")";
    bctx.lineWidth = 2.5;
    bctx.beginPath();
    roundRect(bctx, -s / 2, -s / 2, s, s, s * 0.26);
    bctx.stroke();
    bctx.restore();
  }
  // 提示
  if (B.hintCell >= 0) {
    const cells = [B.hintCell, B.hintCell2];
    const a = 0.35 + 0.4 * Math.abs(Math.sin(t * 3.2));
    cells.forEach((i) => {
      if (i == null) return;
      const x = i % B.W, y = (i / B.W) | 0;
      const s = B.cell * 0.9;
      bctx.save();
      bctx.translate(cellCX(x), cellCY(y));
      bctx.strokeStyle = "rgba(255,240,160," + a + ")";
      bctx.lineWidth = 2;
      bctx.beginPath();
      roundRect(bctx, -s / 2, -s / 2, s, s, s * 0.26);
      bctx.stroke();
      bctx.restore();
    });
  }

  // 宝石
  for (let y = 0; y < B.H; y++) {
    for (let x = 0; x < B.W; x++) {
      const tl = B.grid[y * B.W + x];
      if (!tl) continue;
      const spr = gemSprites[tl.t];
      if (!spr) continue;
      tl.sc += (1 - tl.sc) * Math.min(1, 9 * (1 / 60));
      const full = (spriteSize + gemPad * 2) * tl.sc;
      const bx = tl.px - full / 2, by = tl.py - full / 2;
      if (tl.sp) {
        bctx.save();
        const pulse = 1 + 0.06 * Math.sin(t * 6 + tl.id);
        bctx.translate(tl.px, tl.py);
        bctx.scale(pulse, pulse);
        bctx.globalCompositeOperation = "lighter";
        const gr = bctx.createRadialGradient(0, 0, B.cell * 0.1, 0, 0, B.cell * 1.15);
        gr.addColorStop(0, "rgba(180,240,255,.42)");
        gr.addColorStop(1, "rgba(120,180,255,0)");
        bctx.fillStyle = gr;
        bctx.beginPath();
        bctx.arc(0, 0, B.cell * 1.15, 0, TAU);
        bctx.fill();
        bctx.restore();
      }
      bctx.drawImage(spr, bx, by, full, full);
      if (tl.sp) drawSpecialMark(tl, t);
    }
  }

  // 斜向扫光（提升光泽感）
  const sweep = ((t * 0.17) % 1.7) - 0.35;
  bctx.save();
  bctx.globalCompositeOperation = "lighter";
  const sg = bctx.createLinearGradient(S * sweep, 0, S * (sweep + 0.55), S);
  sg.addColorStop(0, "rgba(180,225,255,0)");
  sg.addColorStop(0.5, "rgba(210,240,255,.075)");
  sg.addColorStop(1, "rgba(180,225,255,0)");
  bctx.fillStyle = sg;
  bctx.fillRect(0, 0, S, S);
  bctx.restore();

  // 特效
  bctx.save();
  for (const f of B.fx) {
    const u = f.t / f.life;
    bctx.globalAlpha = 1;
    if (f.k === "p") {
      const a = 1 - u * u;
      bctx.globalCompositeOperation = "lighter";
      bctx.fillStyle = "rgba(" + f.rgb + "," + (a * 0.95) + ")";
      bctx.save();
      bctx.translate(f.x, f.y);
      bctx.rotate(f.rot);
      if (f.sq) bctx.fillRect(-f.size / 2, -f.size / 2, f.size, f.size * 0.65);
      else {
        bctx.beginPath();
        bctx.arc(0, 0, f.size * (1 - u * 0.5), 0, TAU);
        bctx.fill();
      }
      bctx.restore();
      continue;
    }
    if (f.k === "r") {
      bctx.globalCompositeOperation = "lighter";
      bctx.strokeStyle = "rgba(" + f.rgb + "," + ((1 - u) * 0.85) + ")";
      bctx.lineWidth = Math.max(1.2, B.cell * 0.13 * (1 - u));
      bctx.beginPath();
      bctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * Math.sqrt(u), 0, TAU);
      bctx.stroke();
      continue;
    }
    if (f.k === "l") {
      const a = 1 - u;
      bctx.globalCompositeOperation = "lighter";
      const len = B.cell * 9 * u;
      const gr = f.horiz
        ? bctx.createLinearGradient(f.x - len, f.y, f.x + len, f.y)
        : bctx.createLinearGradient(f.x, f.y - len, f.x, f.y + len);
      gr.addColorStop(0, "rgba(160,230,255,0)");
      gr.addColorStop(0.5, "rgba(230,250,255," + (a * 0.9) + ")");
      gr.addColorStop(1, "rgba(160,230,255,0)");
      bctx.strokeStyle = gr;
      bctx.lineWidth = B.cell * 0.5 * a + 1;
      bctx.beginPath();
      if (f.horiz) { bctx.moveTo(f.x - len, f.y); bctx.lineTo(f.x + len, f.y); }
      else { bctx.moveTo(f.x, f.y - len); bctx.lineTo(f.x, f.y + len); }
      bctx.stroke();
      continue;
    }
  }
  bctx.restore();
  bctx.restore(); // clip
  bctx.restore(); // shake
}

function drawSpecialMark(tl, t) {
  const x = tl.px, y = tl.py, r = B.cell * 0.42;
  bctx.save();
  bctx.translate(x, y);
  if (tl.sp === SP.H || tl.sp === SP.V) {
    bctx.globalCompositeOperation = "lighter";
    const gr = bctx.createLinearGradient(tl.sp === SP.H ? -r * 1.6 : 0, tl.sp === SP.H ? 0 : -r * 1.6, tl.sp === SP.H ? r * 1.6 : 0, tl.sp === SP.H ? 0 : r * 1.6);
    gr.addColorStop(0, "rgba(200,250,255,0)");
    gr.addColorStop(0.5, "rgba(255,255,255,.95)");
    gr.addColorStop(1, "rgba(200,250,255,0)");
    bctx.strokeStyle = gr;
    bctx.lineWidth = r * 0.5;
    bctx.beginPath();
    if (tl.sp === SP.H) { bctx.moveTo(-r * 1.5, 0); bctx.lineTo(r * 1.5, 0); }
    else { bctx.moveTo(0, -r * 1.5); bctx.lineTo(0, r * 1.5); }
    bctx.stroke();
  } else if (tl.sp === SP.BOMB) {
    bctx.globalCompositeOperation = "lighter";
    bctx.strokeStyle = "rgba(255,235,170,.95)";
    bctx.lineWidth = r * 0.22;
    bctx.beginPath();
    bctx.arc(0, 0, r * 0.82, 0, TAU);
    bctx.stroke();
    bctx.beginPath();
    bctx.arc(0, 0, r * 0.5, 0, TAU);
    bctx.stroke();
  } else if (tl.sp === SP.RAINBOW) {
    bctx.rotate(t * 1.8);
    bctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 6; i++) {
      bctx.strokeStyle = "hsla(" + (i * 60 + t * 120) + ",100%,72%,.95)";
      bctx.lineWidth = r * 0.26;
      bctx.beginPath();
      bctx.arc(0, 0, r * 0.86, (i / 6) * TAU, ((i + 1) / 6) * TAU - 0.1);
      bctx.stroke();
    }
    bctx.fillStyle = "rgba(255,255,255,.95)";
    bctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      const rr = i % 2 ? r * 0.16 : r * 0.48;
      bctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    bctx.closePath();
    bctx.fill();
  }
  bctx.restore();
}
/* --------- HUD --------- */
function gemDot(t, n) {
  const g = GEMS[t] || GEMS[0];
  return '<span class="gemDot" style="background:radial-gradient(circle at 35% 30%,' + g.hi + ',' + g.mid + ' 55%,' + g.lo + ')"></span>';
}
function renderObjective() {
  const cfg = B.cfg;
  const dots = $("objDots");
  let num = "", lab = "";
  if (cfg.kind === "collect") {
    dots.innerHTML = cfg.colors2.map((c) => gemDot(c)).join("");
    lab = "收集目标";
    num = cfg.needs.join(" / ");
  } else if (cfg.kind === "leaf") {
    dots.innerHTML = '<span class="gemDot" style="background:radial-gradient(circle at 35% 30%,#c8ffd8,#4fbf78 55%,#1c6b3e)"></span>';
    lab = "清除枯叶";
    num = B.leavesLeft + "";
  } else {
    dots.innerHTML = '<span class="gemDot" style="background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc24d 55%,#c46a00)"></span>';
    lab = "目标分数";
    num = cfg.target + "";
  }
  $("objLab").textContent = lab;
  $("objNum").textContent = num;
}
function updatePlayHUD() {
  const cfg = B.cfg;
  $("pMoves").textContent = Math.max(0, B.moves);
  $("pScore").textContent = B.score;
  if (cfg.kind === "collect") {
    const arr = cfg.colors2.map((c, i) => Math.max(0, cfg.needs[i] - (B.cleared[c] || 0)));
    $("objNum").textContent = arr.join(" / ");
    $("objNum").style.color = arr.every((v) => v === 0) ? "#8ff5c8" : "";
  } else if (cfg.kind === "leaf") {
    $("objNum").textContent = B.leavesLeft;
    $("objNum").style.color = B.leavesLeft === 0 ? "#8ff5c8" : "";
  } else {
    $("objNum").textContent = Math.max(0, cfg.target - B.score);
    $("objNum").style.color = B.score >= cfg.target ? "#8ff5c8" : "";
  }
  for (let i = 0; i < 3; i++) {
    const el = $("bct" + i);
    if (el) el.textContent = SAVE.boosters ? SAVE.boosters[i] : 0;
  }
}
function showCombo(n, mult) {
  const el = $("comboText");
  const words = ["", "连锁!", "双连锁!", "三连锁!", "超连锁!", "花火连锁!", "星辉连锁!"];
  el.textContent = (words[Math.min(n, 6)] || "神迹连锁!") + " x" + mult.toFixed(1);
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
}

/* --------- 输入 --------- */
let ptr = null;
function cellFromPoint(clientX, clientY) {
  const r = boardCv.getBoundingClientRect();
  const x = clientX - r.left, y = clientY - r.top;
  const gx = Math.floor((x - B.pad) / B.cell);
  const gy = Math.floor((y - B.pad) / B.cell);
  if (gx < 0 || gy < 0 || gx >= B.W || gy >= B.H) return -1;
  return gy * B.W + gx;
}
function onDown(e) {
  if (B.phase === "won" || B.phase === "lost") return;
  const p = e.touches ? e.touches[0] : e;
  const i = cellFromPoint(p.clientX, p.clientY);
  if (i < 0) return;
  B.hintT = 0; B.hintCell = -1;
  if (B.armed === 0) {
    useHammer(i);
    return;
  }
  if (B.phase !== "idle") return;
  ptr = { i, x: p.clientX, y: p.clientY, done: false };
  if (B.sel >= 0 && B.sel !== i) {
    const ax = B.sel % B.W, ay = (B.sel / B.W) | 0;
    const bx = i % B.W, by = (i / B.W) | 0;
    if (Math.abs(ax - bx) + Math.abs(ay - by) === 1) {
      attemptSwap(B.sel, i);
      B.sel = -1;
      ptr = null;
      return;
    }
    B.sel = i;
    SFX.tap();
  } else {
    B.sel = B.sel === i ? -1 : i;
    SFX.tap();
  }
}
function onMove(e) {
  if (!ptr || ptr.done) return;
  const p = e.touches ? e.touches[0] : e;
  const dx = p.clientX - ptr.x, dy = p.clientY - ptr.y;
  const th = B.cell * 0.36;
  if (Math.abs(dx) < th && Math.abs(dy) < th) return;
  ptr.done = true;
  const x = ptr.i % B.W, y = (ptr.i / B.W) | 0;
  let nx = x, ny = y;
  if (Math.abs(dx) > Math.abs(dy)) nx += dx > 0 ? 1 : -1;
  else ny += dy > 0 ? 1 : -1;
  if (nx < 0 || ny < 0 || nx >= B.W || ny >= B.H) return;
  B.sel = -1;
  attemptSwap(ptr.i, ny * B.W + nx);
}
function onUp() { ptr = null; }

function useHammer(i) {
  if (!SAVE.boosters || SAVE.boosters[0] <= 0) { B.armed = -1; return; }
  SAVE.boosters[0]--;
  B.armed = -1;
  persist();
  B.phase = "busy";
  const tl = B.grid[i];
  if (tl) burst(cellCX(i % B.W), cellCY((i / B.W) | 0), tl.t, 1);
  const done = expandSpecials(new Set([i]));
  done.forEach((k) => {
    const o = B.grid[k];
    if (!o) return;
    B.cleared[o.t] = (B.cleared[o.t] || 0) + 1;
    if (B.leaves[k]) { B.leaves[k] = 0; B.leavesLeft = Math.max(0, B.leavesLeft - 1); }
    burst(cellCX(k % B.W), cellCY((k / B.W) | 0), o.t, 0);
    B.grid[k] = null;
  });
  B.score += done.size * 10;
  B.shake = 0.35;
  buzz(16);
  updatePlayHUD();
  after(0.16, () => { refill(); after(0.26, resolveBoard); });
}

/* --------- 关卡流程 --------- */
function startLevel(n) {
  closeScreens();
  $("scr-play").classList.add("on");
  $("nav").classList.remove("on");
  sceneMode = "play";
  $("pLv").textContent = n;
  B.hintCell2 = -1;
  boardStart(n);
  requestAnimationFrame(() => layoutBoard());
}
function finishLevel(win) {
  const cfg = B.cfg;
  let stars = 0;
  if (win) {
    stars = 1;
    if (B.score >= cfg.star2) stars = 2;
    if (B.score >= cfg.star3) stars = 3;
  }
  const coins = win ? 18 + B.level * 4 + stars * 12 : 3 + B.level;
  const matN = win ? 2 + (stars >= 3 ? 1 : 0) : 0;
  SAVE.coins += coins;
  if (win) {
    if ((SAVE.stars[B.level] || 0) < stars) SAVE.stars[B.level] = stars;
    SAVE.maxLevel = Math.max(SAVE.maxLevel, Math.min(40, B.level + 1));
    if (B.score > SAVE.best) SAVE.best = B.score;
    if (B.score > SAVE.weekBest) SAVE.weekBest = B.score;
    if (SAVE.boosters) {
      if (stars >= 2) SAVE.boosters[1] = Math.min(9, SAVE.boosters[1] + 1);
      if (stars >= 3) SAVE.boosters[2] = Math.min(9, SAVE.boosters[2] + 1);
    }
  }
  const added = addMats(matN);
  SAVE.merges = SAVE.merges || 0;
  persist();
  refreshHome();

  $("rTitle").textContent = win ? (stars >= 3 ? "完美通关" : "关卡完成") : "挑战失败";
  $("rStars").innerHTML = [0, 1, 2].map((i) => '<span class="' + (i < stars ? "lit" : "") + '">★</span>').join("");
  $("rScore").textContent = B.score;
  $("rReward").innerHTML =
    '<span>🪙 +' + coins + '</span>' +
    (matN ? '<span>🌾 材料 x' + added + '</span>' : "") +
    (win ? '<span>🎯 ' + (cfg.kind === "collect" ? "收集达成" : cfg.kind === "leaf" ? "枯叶清空" : "分数达标") + '</span>' : '<span>再试一次吧</span>');
  $("rNext").textContent = win && B.level < 40 ? "下一关" : "返回花园";
  closeScreens();
  $("scr-result").classList.add("on");
  $("nav").classList.remove("on");
  sceneMode = "home";
}
function addMats(n) {
  let added = 0;
  const kinds = [0, 1, 2, 3];
  for (let k = 0; k < n; k++) {
    let slot = SAVE.ws.indexOf(null);
    if (slot < 0) { SAVE.points += 5; continue; }
    SAVE.ws[slot] = { t: pick(kinds), lv: 1 };
    added++;
  }
  return added;
}

/* --------- 界面切换 --------- */
function closeScreens() {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("on"));
}
function showScreen(name) {
  closeScreens();
  const map = { home: "scr-home", levels: "scr-levels", workshop: "scr-workshop", book: "scr-book" };
  sceneMode = "home";
  $(map[name]).classList.add("on");
  $("nav").classList.add("on");
  document.querySelectorAll(".navItem").forEach((n) => n.classList.toggle("act", n.dataset.go === name));
  if (name === "levels") renderLevels();
  if (name === "workshop") renderWorkshop();
  if (name === "book") renderDeco();
  refreshHome();
}

/* --------- 花园主页 --------- */
function refreshHome() {
  const totalStars = Object.values(SAVE.stars).reduce((a, b) => a + b, 0);
  const done = Object.keys(SAVE.stars).length;
  $("hStars").textContent = totalStars;
  $("hStars2").textContent = totalStars;
  $("hCoins").textContent = SAVE.coins;
  $("hLv").textContent = done;
  $("hPts").textContent = SAVE.points;
  $("hPts2").textContent = SAVE.points;
  $("hPts3").textContent = SAVE.points;
  $("hBest").textContent = SAVE.weekBest || 0;
  const n = Math.min(40, SAVE.maxLevel);
  $("nextLv").textContent = n;
  const cfg = levelCfg(n);
  const desc = cfg.kind === "collect" ? "消除指定花朵 " + cfg.needs.join(" + ") + " 个" : cfg.kind === "leaf" ? "清除 " + cfg.leaves + " 片枯叶" : "达到 " + cfg.target + " 分";
  $("nextInfo").textContent = "第 " + n + " 关 · " + desc;
}

/* --------- 关卡列表 --------- */
function renderLevels() {
  const grid = $("lvlGrid");
  grid.innerHTML = "";
  for (let n = 1; n <= 40; n++) {
    const locked = n > SAVE.maxLevel;
    const st = SAVE.stars[n] || 0;
    const el = document.createElement("div");
    el.className = "lvlBtn" + (locked ? " locked" : st ? " done" : "");
    el.innerHTML = '<div class="num">' + n + '</div><div class="stars">' + (st ? "★".repeat(st) : locked ? "🔒" : "") + "</div>";
    if (!locked) el.onclick = () => { SFX.tap(); startLevel(n); };
    else el.onclick = () => { SFX.tap(); buzz(8); };
    grid.appendChild(el);
  }
  const ch = Math.min(4, Math.floor((SAVE.maxLevel - 1) / 8));
  $("chapterLabel").textContent = "第" + "一二三四五"[ch] + "章 · " + CHAPTERS[ch];
}

/* --------- 工坊 --------- */
const MAT_NAME = ["花瓣", "露珠", "晶石", "星屑"];
const MAT_COLOR = [
  ["#ffb3d4", "#ff5f9e"],
  ["#b3e6ff", "#3fa8e0"],
  ["#d4c6ff", "#7b5cff"],
  ["#ffe7a8", "#efaf35"],
];
let wsSel = [];

function renderWorkshop() {
  const grid = $("wsGrid");
  grid.innerHTML = "";
  wsSel = [];
  for (let i = 0; i < 16; i++) {
    const it = SAVE.ws[i];
    const d = document.createElement("div");
    d.className = "slot";
    if (it) {
      const c = MAT_COLOR[it.t];
      d.innerHTML = '<div class="item" style="background:radial-gradient(circle at 35% 30%,' + c[0] + ',' + c[1] + ' 60%,rgba(10,15,35,.9))">' + it.lv + '</div><div class="lv">' + MAT_NAME[it.t] + "</div>";
    }
    d.onclick = () => toggleWsSel(i, d);
    grid.appendChild(d);
  }
  updateWsProgress();
}
function toggleWsSel(i, node) {
  if (!SAVE.ws[i]) return;
  SFX.tap();
  const idx = wsSel.indexOf(i);
  if (idx >= 0) {
    wsSel.splice(idx, 1);
    node.classList.remove("sel");
    return;
  }
  wsSel.push(i);
  node.classList.add("sel");
  if (wsSel.length === 3) {
    const a = SAVE.ws[wsSel[0]], b = SAVE.ws[wsSel[1]], c = SAVE.ws[wsSel[2]];
    if (a && b && c && a.t === b.t && b.t === c.t && a.lv === b.lv) {
      const lv = Math.min(4, a.lv + 1);
      const gain = a.lv * 4 + 4;
      SAVE.points += gain;
      SAVE.merges++;
      SAVE.ws[wsSel[0]] = { t: a.t, lv };
      SAVE.ws[wsSel[1]] = null;
      SAVE.ws[wsSel[2]] = null;
      persist();
      SFX.special();
      buzz(20);
      renderWorkshop();
      refreshHome();
      toast("合成成功！+" + gain + " 装饰点");
    } else {
      wsSel = [];
      document.querySelectorAll(".slot.sel").forEach((s) => s.classList.remove("sel"));
      toast("需要 3 个相同等级的材料");
    }
  }
}
function updateWsProgress() {
  const filled = SAVE.ws.filter(Boolean).length;
  $("wsMeter").style.width = (filled / 16) * 100 + "%";
  $("wsProgress").textContent = "收纳格 " + filled + "/16 · 已合成 " + (SAVE.merges || 0) + " 次";
}

/* --------- 装扮 --------- */
const DECOS = [
  { id: "flowerbed", name: "春日花圃", desc: "让整片花园开满霓虹色的花", icon: "🌷", cost: 8 },
  { id: "lanterns", name: "萤火灯笼", desc: "檐下悬挂温暖的灯光", icon: "🏮", cost: 18 },
  { id: "fountain", name: "月光喷泉", desc: "夜色中流动的水光", icon: "⛲", cost: 30 },
  { id: "arch", name: "星辉拱门", desc: "通往花庭的光之门", icon: "🌈", cost: 46 },
  { id: "aurora", name: "极光帷幕", desc: "天空流转的极光", icon: "🌌", cost: 64 },
  { id: "whale", name: "星海鲸鱼", desc: "游過夜空的温柔巨兽", icon: "🐋", cost: 88 },
];
function renderDeco() {
  const list = $("decoList");
  list.innerHTML = "";
  DECOS.forEach((d) => {
    const owned = SAVE.deco.indexOf(d.id) >= 0;
    const el = document.createElement("div");
    el.className = "deco glass" + (owned ? " owned" : "");
    el.innerHTML =
      '<div class="ic">' + d.icon + '</div>' +
      '<div class="tx"><b>' + d.name + '</b><i>' + d.desc + '</i></div>' +
      '<button class="btn' + (owned ? " ghost" : "") + '">' + (owned ? "已拥有" : d.cost + " 点") + "</button>";
    const btn = el.querySelector("button");
    if (!owned) {
      btn.onclick = () => {
        if (SAVE.points < d.cost) { toast("装饰点不足，去工坊合成吧"); return; }
        SAVE.points -= d.cost;
        SAVE.deco.push(d.id);
        persist();
        SFX.special();
        buzz(24);
        renderDeco();
        refreshHome();
        toast(d.name + " 已解锁");
      };
    }
    list.appendChild(el);
  });
}

/* --------- toast --------- */
let toastEl = null;
function toast(msg) {
  if (!toastEl) {
    toastEl = document.createElement("div");
    toastEl.style.cssText = "position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);" +
      "padding:10px 18px;border-radius:999px;background:rgba(16,24,44,.94);border:1px solid rgba(150,200,255,.3);" +
      "color:#eaf4ff;font-size:13px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .3s,transform .3s;opacity:0;white-space:nowrap";
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  toastEl.style.opacity = "1";
  toastEl.style.transform = "translateX(-50%) translateY(-6px)";
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => {
    toastEl.style.opacity = "0";
    toastEl.style.transform = "translateX(-50%)";
  }, 1800);
}
/* --------- 启动与主循环 --------- */
function resizeAll() {
  const w = window.innerWidth, h = window.innerHeight;
  BW = w; BH = h;
  BG_DPR = fitCanvas(bg, bgx, w, h, 1.4);
  buildStatic();
  initAmbient();
  if (B.W && $("scr-play").classList.contains("on")) layoutBoard();
}

let lastT = 0, lastBg = 0;
function frame(now) {
  const dt = Math.min(0.046, lastT ? (now - lastT) / 1000 : 0.016);
  lastT = now;
  B.time += dt;

  for (let i = B.jobs.length - 1; i >= 0; i--) {
    if (B.time >= B.jobs[i].at) {
      const j = B.jobs.splice(i, 1)[0];
      try { j.fn(); } catch (e) { console.warn(e); }
    }
  }

  if (B.grid && B.grid.length) {
    const k = 1 - Math.exp(-17 * dt);
    for (let i = 0; i < B.grid.length; i++) {
      const tl = B.grid[i];
      if (!tl) continue;
      tl.px += (cellCX(tl.gx) - tl.px) * k;
      tl.py += (cellCY(tl.gy) - tl.py) * k;
      if (tl.sc < 1) tl.sc += (1 - tl.sc) * Math.min(1, dt * 12);
    }
  }

  updateFx(dt);
  if (now - lastBg > 30) { lastBg = now; drawScene(now); }

  if (sceneMode === "play") {
    drawBoard(now);
    B.shake *= Math.pow(0.02, dt);
    if (B.shake < 0.01) B.shake = 0;
    if (B.phase === "idle" && !ptr) {
      B.hintT += dt;
      if (B.hintT > 4.2) {
        const h = findHint();
        if (h) { B.hintCell = h[0]; B.hintCell2 = h[1]; }
        B.hintT = 0;
      }
    }
  }
  requestAnimationFrame(frame);
}

function boot() {
  if (!SAVE.boosters || !Array.isArray(SAVE.boosters)) SAVE.boosters = [3, 1, 1];
  resizeAll();
  requestAnimationFrame(frame);

  $("startBtn").onclick = () => {
    SFX.tap(); buzz(14); showScreen("home");
  };
  $("toPlay").onclick = () => {
    SFX.tap();
    const n = Math.min(40, SAVE.maxLevel);
    startLevel(n);
  };
  $("nav").addEventListener("click", (e) => {
    const item = e.target.closest(".navItem");
    if (!item) return;
    SFX.tap();
    showScreen(item.dataset.go);
  });
  $("pbBack").onclick = () => {
    SFX.tap();
    B.phase = "idle";
    persist();
    showScreen("home");
  };
  $("pbSound").onclick = () => {
    SAVE.sound = !SAVE.sound;
    $("pbSound").textContent = SAVE.sound ? "🔊" : "🔈";
    persist();
    if (SAVE.sound) SFX.tap();
  };
  $("pbSound").textContent = SAVE.sound ? "🔊" : "🔈";

  document.querySelectorAll(".boost").forEach((el) => {
    el.onclick = () => {
      const i = +el.dataset.b;
      if (B.phase !== "idle" && B.phase !== "swap") return;
      if (!SAVE.boosters[i]) { toast("道具不足"); return; }
      SFX.tap(); buzz(10);
      if (i === 0) {
        B.armed = B.armed === 0 ? -1 : 0;
      } else if (i === 1) {
        SAVE.boosters[1]--;
        B.phase = "busy";
        for (let k = 0; k < B.grid.length; k++) {
          const tl = B.grid[k];
          if (tl) { tl.t = rndi(B.cfg.colors); tl.sc = 0.5; }
        }
        ensurePlayable();
        after(0.34, () => { B.phase = "idle"; resolveBoard(); });
        toast("已重新洗牌");
      } else {
        SAVE.boosters[2]--;
        B.moves += 5;
        toast("步数 +5");
      }
      persist();
      updatePlayHUD();
      document.querySelectorAll(".boost").forEach((b, bi) => {
        b.classList.toggle("armed", B.armed === bi);
        b.classList.toggle("off", !SAVE.boosters[bi]);
      });
    };
  });

  $("rNext").onclick = () => {
    SFX.tap();
    if (B.phase === "won" && B.level < 40) startLevel(B.level + 1);
    else showScreen("home");
  };
  $("rRetry").onclick = () => {
    SFX.tap();
    startLevel(B.level);
  };
  $("wsAdd").onclick = () => {
    if (SAVE.coins < 50) { toast("金币不足"); return; }
    if (SAVE.ws.indexOf(null) < 0) { toast("收纳格已满"); return; }
    SAVE.coins -= 50;
    addMats(1);
    persist();
    refreshHome();
    renderWorkshop();
    SFX.tap();
  };

  const cv = $("board");
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); onDown(e); }, { passive: false });
  cv.addEventListener("pointermove", (e) => { e.preventDefault(); onMove(e); }, { passive: false });
  cv.addEventListener("pointerup", (e) => { e.preventDefault(); onUp(); }, { passive: false });
  cv.addEventListener("pointercancel", () => onUp());

  window.addEventListener("resize", () => {
    resizeAll();
    if ($("scr-play").classList.contains("on")) layoutBoard();
  });
  window.addEventListener("orientationchange", () => setTimeout(resizeAll, 260));

  refreshHome();

  const unlock = () => {
    SFX.tap();
    window.removeEventListener("pointerdown", unlock);
  };
  window.addEventListener("pointerdown", unlock);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) persist();
  });
}

document.addEventListener("DOMContentLoaded", boot);
if (document.readyState !== "loading") boot();
</script>
