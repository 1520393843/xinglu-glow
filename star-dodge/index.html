<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>星域闪避 · Star Dodge</title>
<style>
  :root { --ink: #eaf2ff; --dim: #7d8bad; --hot: #ff5e7a; --cool: #4fc3f7; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05070f; color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    touch-action: none; overscroll-behavior: none; user-select: none;
  }
  #game { display: block; width: 100%; height: 100%; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    padding: 24px calc(24px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
    background: radial-gradient(circle at 50% 42%, rgba(8,12,26,.4), rgba(2,4,10,.9));
    z-index: 10;
  }
  .overlay[hidden] { display: none; }
  h1 { margin: 0; font-size: clamp(26px, 8vw, 42px); letter-spacing: .12em; font-weight: 800; text-shadow: 0 4px 26px rgba(0,0,0,.75); }
  h1 span { color: var(--hot); }
  .sub { margin: 0; color: #b9c6de; font-size: 14px; line-height: 1.7; max-width: 21em; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  .score { font-variant-numeric: tabular-nums; font-size: clamp(22px, 7vw, 34px); font-weight: 800; }
  .best { color: var(--dim); font-size: 13px; letter-spacing: .08em; }
  button.go {
    appearance: none; border: 1px solid rgba(255,255,255,.22); border-radius: 999px;
    padding: 13px 34px; font-size: 16px; font-weight: 700; letter-spacing: .1em;
    color: #06111f; background: linear-gradient(180deg, #9be8ff, #4fc3f7);
    box-shadow: 0 8px 28px rgba(79,195,247,.35); cursor: pointer;
  }
  button.go.ghost { background: rgba(10,18,34,.6); color: var(--ink); box-shadow: none; }
  button.go:active { transform: translateY(1px) scale(.99); }
  .hint { color: var(--dim); font-size: 12px; letter-spacing: .06em; }
  .row { display: flex; gap: 10px; align-items: center; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5;
    padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 14px calc(14px + env(safe-area-inset-left)); }
  #hud.hidden { display: none; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .left { display: flex; flex-direction: column; gap: 3px; font-variant-numeric: tabular-nums; }
  .sc { font-size: 26px; font-weight: 800; letter-spacing: .04em; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  .sc em { font-style: normal; font-size: 14px; color: #ffd166; margin-left: 6px; opacity: 0; transition: opacity .2s; }
  .sc em.on { opacity: 1; }
  .meta { font-size: 11px; color: #a9b7cf; letter-spacing: .1em; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  .hearts { margin-top: 4px; display: flex; gap: 5px; }
  .hearts i { width: 13px; height: 13px; display: block; background: var(--hot);
    clip-path: polygon(50% 100%, 0 38%, 0 18%, 18% 0, 35% 0, 50% 14%, 65% 0, 82% 0, 100% 18%, 100% 38%);
    box-shadow: 0 0 10px rgba(255,94,122,.65); }
  .hearts i.off { background: rgba(255,255,255,.16); box-shadow: none; }
  .btns { display: flex; gap: 8px; pointer-events: auto; }
  .btns button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16);
    background: rgba(8,14,28,.55); color: var(--ink); font-size: 15px; line-height: 1; cursor: pointer; }
  .btns button.off { opacity: .45; }
  #wavebar { position: absolute; left: 14px; right: 14px; top: calc(88px + env(safe-area-inset-top));
    height: 2px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
  #wavefill { height: 100%; width: 0%; background: linear-gradient(90deg, #4fc3f7, #ff5e7a); }
  #scrim { position: fixed; left: 0; right: 0; top: 0; height: 148px; z-index: 4; pointer-events: none;
    background: linear-gradient(180deg, rgba(3,6,14,.86), rgba(3,6,14,.42) 52%, rgba(3,6,14,0)); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 6; }
  #dbg { position: fixed; left: 12px; bottom: 12px; z-index: 20; font-size: 11px; line-height: 1.5;
    color: #9be8ff; background: rgba(0,0,0,.55); padding: 6px 9px; border-radius: 8px; pointer-events: none; display: none; white-space: pre; }
  #dbg.on { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="flash"></div>

<div id="scrim"></div>
<div id="hud" class="hidden">
  <div class="top">
    <div class="left">
      <div class="sc"><span id="score">0</span><em id="combo">x1</em></div>
      <div class="meta" id="meta">WAVE 1 · 0.0s</div>
      <div class="hearts" id="hearts"><i></i><i></i><i></i></div>
    </div>
    <div class="btns">
      <button id="pause" aria-label="暂停">❚❚</button>
      <button id="mute" aria-label="静音">♪</button>
    </div>
  </div>
  <div id="wavebar"><div id="wavefill"></div></div>
</div>

<div class="overlay" id="menu">
  <h1>星域<span>闪避</span></h1>
  <p class="sub">拖动屏幕移动飞船，躲开弹幕、收集星星。<br>贴近子弹擦过有加分，连捡星星能叠倍率。</p>
  <p class="best" id="menuBest">最高分 0</p>
  <button class="go" id="start">开始</button>
  <p class="hint" id="loadNote">素材加载中 0/10</p>
  <p class="hint">触屏拖动 / 键盘方向键或 WASD</p>
</div>

<div class="overlay" id="paused" hidden>
  <h1>暂停</h1>
  <div class="row">
    <button class="go" id="resume">继续</button>
    <button class="go ghost" id="quit">重新开始</button>
  </div>
  <p class="hint">切到后台会自动暂停</p>
</div>

<div class="overlay" id="over" hidden>
  <h1>撞上了</h1>
  <p class="score" id="finalScore">0</p>
  <p class="best" id="finalBest">最高分 0</p>
  <p class="hint" id="finalStats"></p>
  <button class="go" id="again">再来一局</button>
  <p class="hint">点空白处也可以重开</p>
</div>

<div id="dbg"></div>

<script>
(function () {
  'use strict';

  // ================= 调参区 =================
  var TUNE = {
    dragSens: 1.2,          // 拖动灵敏度
    playerSpeed: 500,        // 键盘移动速度 px/s
    lives: 3,
    invulnAfterHit: 1.9,
    startInvuln: 1.2,
    pickupScore: 25,
    nearMissScore: 5,
    nearMissPad: 9,         // 擦弹判定附加半径
    nearMissCooldown: 0.1,  // 擦弹音效最短间隔
    magnetRadius: 100,       // 星星吸附范围
    comboWindow: 6,          // 连击保持时间 s
    comboStep: 3,            // 每 3 次叠一级
    comboMax: 5,
    waveSeconds: 12,
    musicGain: 0.42,
    sfxGain: 1.0,
    battleFromWave: 3,       // 第 3 波起换战斗曲
    maxParticles: 240,
    maxBullets: 420,
    dprCap: 2
  };

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d', { alpha: false });
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  var TAU = Math.PI * 2;
  var W = 0, H = 0, DPR = 1;

  function hexA(hex, a) {
    var h = hex.replace('#', '');
    return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16) + ',' + a + ')';
  }

  var PALETTES = [
    { glow: '#4fc3f7', star: '#cfe8ff', accent: '#ff5e7a', wash: '#2b6cb0' },
    { glow: '#c084fc', star: '#f3e8ff', accent: '#ffb020', wash: '#7c3aed' },
    { glow: '#4ade80', star: '#d1fae5', accent: '#ff7ab8', wash: '#10b981' },
    { glow: '#fbbf24', star: '#fff3d6', accent: '#41d1ff', wash: '#f97316' }
  ];
  var pal = PALETTES[0];

  // ================= 素材 =================
  var IMAGES = [
    ['nebula', 'assets/bg-nebula.jpg'],
    ['starburst', 'assets/bg-starburst.jpg'],
    ['earth', 'assets/bg-earth.jpg'],
    ['cloud', 'assets/bg-cloud.jpg']
  ];
  var SOUNDS = [
    ['calm', 'assets/bgm.wav'],
    ['battle', 'assets/bgm2.wav'],
    ['hit', 'assets/sfx-hit.wav'],
    ['laser', 'assets/sfx-laser.wav'],
    ['pickup', 'assets/sfx-pickup.wav'],
    ['wave', 'assets/sfx-wave.wav']
  ];
  var BG_FOR_WAVE = ['nebula', 'starburst', 'earth', 'cloud'];
  var Assets = { img: {}, buf: {}, imgOk: 0, bufOk: 0 };

  function dbg(text) {
    var el = $('dbg'); if (!el) return;
    if (/[?&]debug/.test(location.search)) el.classList.add('on');
    el.textContent = text;
  }

  function loadImage(key, url) {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () { Assets.img[key] = im; Assets.imgOk++; resolve(true); };
      im.onerror = function () { resolve(false); };
      im.src = url;
    });
  }

  function loadSound(key, url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.arrayBuffer();
    }).then(function (ab) {
      var c = Sound.ctx; if (!c) return false;
      return new Promise(function (resolve) {
        c.decodeAudioData(ab, function (b) { Assets.buf[key] = b; Assets.bufOk++; resolve(true); }, function () { resolve(false); });
      });
    }).catch(function () { return false; });
  }

  function noteProgress() {
    var el = $('loadNote'); if (!el) return;
    var have = Assets.imgOk + Assets.bufOk, all = IMAGES.length + SOUNDS.length;
    if (have >= all) el.textContent = '素材已就绪 · ' + (Assets.bufOk) + ' 段音频';
    else el.textContent = '素材加载中 ' + have + '/' + all;
  }

  function loadAll() {
    Sound.init();
    var jobs = [];
    IMAGES.forEach(function (p) { jobs.push(loadImage(p[0], p[1]).then(noteProgress)); });
    SOUNDS.forEach(function (p) { jobs.push(loadSound(p[0], p[1]).then(noteProgress)); });
    return Promise.all(jobs).then(function () {
      dbg('图片 ' + Assets.imgOk + '/' + IMAGES.length + ' · 音频 ' + Assets.bufOk + '/' + SOUNDS.length);
      return true;
    });
  }

  // ================= 音频 =================
  var Sound = {
    ctx: null, master: null, musicGain: null, sfxGain: null,
    muted: false, playing: false, kind: '', tracks: {},

    init: function () {
      if (this.ctx) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0; this.musicGain.connect(this.master);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = TUNE.sfxGain; this.sfxGain.connect(this.master);
    },
    unlock: function () {
      this.init();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    has: function (k) { return !!Assets.buf[k]; },

    sfx: function (key, opt) {
      var c = this.ctx;
      if (!c || !Assets.buf[key]) return false;
      opt = opt || {};
      var src = c.createBufferSource();
      src.buffer = Assets.buf[key];
      if (opt.rate) src.playbackRate.value = opt.rate;
      var g = c.createGain();
      g.gain.value = opt.gain == null ? 1 : opt.gain;
      src.connect(g); g.connect(this.sfxGain);
      var off = opt.offset || 0, dur = opt.dur || 0;
      if (dur > 0) src.start(0, off, dur); else src.start(0, off);
      return true;
    },

    makeTrack: function (key) {
      var c = this.ctx;
      if (!c || !Assets.buf[key]) return null;
      var src = c.createBufferSource();
      src.buffer = Assets.buf[key];
      src.loop = true;
      var g = c.createGain(); g.gain.value = 0;
      src.connect(g); g.connect(this.musicGain);
      src.start(0);
      return { src: src, gain: g };
    },

    startMusic: function (kind) {
      this.init(); if (!this.ctx) return;
      this.playing = true;
      this.kind = kind;
      var self = this;
      ['calm', 'battle'].forEach(function (k) {
        if (!self.tracks[k]) self.tracks[k] = self.makeTrack(k);
      });
      var now = this.ctx.currentTime;
      this.musicGain.gain.cancelScheduledValues(now);
      this.musicGain.gain.linearRampToValueAtTime(this.muted ? 0 : TUNE.musicGain, now + 0.7);
      this.select(kind);
      if (!this.tracks.calm && !this.tracks.battle) this.startSynth();
      dbg('音乐 ' + (this.tracks[kind] ? '真实录音(' + kind + ')' : '合成兜底') + ' · 图片 ' + Assets.imgOk + '/' + IMAGES.length + ' · 音频 ' + Assets.bufOk + '/' + SOUNDS.length);
    },

    select: function (kind) {
      if (!this.ctx) return;
      var now = this.ctx.currentTime;
      var self = this;
      ['calm', 'battle'].forEach(function (k) {
        var t = self.tracks[k];
        if (!t) return;
        var target = (k === kind) ? 1 : 0;
        t.gain.gain.cancelScheduledValues(now);
        t.gain.gain.linearRampToValueAtTime(target, now + 0.9);
      });
    },

    stopMusic: function () {
      this.playing = false;
      this.stopSynth();
      if (!this.ctx) return;
      var now = this.ctx.currentTime;
      this.musicGain.gain.cancelScheduledValues(now);
      this.musicGain.gain.linearRampToValueAtTime(0, now + 0.3);
      for (var k in this.tracks) {
        if (!this.tracks[k]) continue;
        try { this.tracks[k].src.stop(now + 0.35); } catch (e) {}
        this.tracks[k] = null;
      }
    },

    toggleMute: function () {
      this.muted = !this.muted;
      if (this.master) this.master.gain.value = this.muted ? 0 : 0.9;
      return this.muted;
    },

    // 合成兜底
    tone: function (type, freq, t0, dur, vol, dest, slideTo) {
      var c = this.ctx; if (!c) return;
      var o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(dest || this.master);
      o.start(t0); o.stop(t0 + dur + 0.03);
    },
    noise: function (t0, dur, vol, hp, dest) {
      var c = this.ctx; if (!c) return;
      var len = Math.max(1, Math.floor(c.sampleRate * dur));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var s = c.createBufferSource(); s.buffer = buf;
      var f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 4000;
      var g = c.createGain(); g.gain.value = vol;
      s.connect(f); f.connect(g); g.connect(dest || this.master);
      s.start(t0);
    }
  };

  Sound.synthTimer = null;
  Sound.startSynth = function () {
    var self = this;
    if (!this.ctx) return;
    var bpm = 112, step = 0, next = this.ctx.currentTime + 0.08;
    var CH = [
      { root: 220.00, notes: [440.00, 523.25, 659.25] },
      { root: 174.61, notes: [349.23, 440.00, 523.25] },
      { root: 261.63, notes: [523.25, 659.25, 783.99] },
      { root: 196.00, notes: [392.00, 493.88, 587.33] }
    ];
    if (this.synthTimer) clearInterval(this.synthTimer);
    this.synthTimer = setInterval(function () {
      var c = self.ctx; if (!c || !self.playing) return;
      var spb = 60 / bpm / 4;
      while (next < c.currentTime + 0.12) {
        var bar = Math.floor(step / 16) % 4, s = step % 16, ch = CH[bar], t = next, g = self.musicGain;
        if (s % 4 === 0) self.tone('triangle', ch.root / 2, t, spb * 3.2, 0.5, g);
        if (s % 2 === 0) self.tone('square', ch.notes[(s / 2) % ch.notes.length], t, spb * 1.2, 0.07, g);
        if (s % 2 === 1) self.noise(t, 0.035, 0.04, 7000, g);
        next += spb; step++;
      }
    }, 25);
  };
  Sound.stopSynth = function () {
    if (this.synthTimer) { clearInterval(this.synthTimer); this.synthTimer = null; }
  };

  // ================= 精灵 =================
  var sprite = {};
  function buildSprites() {
    function mk(size, inner, outer) {
      var c = document.createElement('canvas'); c.width = c.height = size;
      var g = c.getContext('2d');
      var rg = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      rg.addColorStop(0, inner); rg.addColorStop(0.45, outer); rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = rg; g.fillRect(0, 0, size, size);
      return c;
    }
    sprite.bullet = mk(64, 'rgba(255,235,240,1)', 'rgba(255,94,122,.55)');
    sprite.glow = mk(128, 'rgba(155,232,255,.9)', 'rgba(79,195,247,.25)');
    sprite.star = mk(64, 'rgba(255,255,255,1)', 'rgba(255,225,140,.6)');
    sprite.shock = mk(128, 'rgba(255,255,255,0)', 'rgba(255,255,255,.35)');
  }

  // ================= 背景（双缓冲交叉淡入） =================
  var bd = { cur: null, prev: null, fade: 1, key: '' };

  function makeBackdrop(key) {
    var img = Assets.img[key];
    var cw = Math.max(2, Math.round(W)), chh = Math.max(2, Math.round(H));
    var c = document.createElement('canvas');
    c.width = cw; c.height = chh;
    var b = c.getContext('2d');
    if (img) {
      var scale = Math.max(cw / img.width, chh / img.height);
      var sw = cw / scale, sh = chh / scale;
      b.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, cw, chh);
      b.fillStyle = 'rgba(3,5,14,.56)';
      b.fillRect(0, 0, cw, chh);
      b.globalCompositeOperation = 'soft-light';
      b.fillStyle = hexA(pal.wash, 0.6);
      b.fillRect(0, 0, cw, chh);
      b.globalCompositeOperation = 'source-over';
      var vg = b.createRadialGradient(cw / 2, chh * 0.46, Math.min(cw, chh) * 0.12, cw / 2, chh * 0.46, Math.max(cw, chh) * 0.78);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,.74)');
      b.fillStyle = vg; b.fillRect(0, 0, cw, chh);
    } else {
      var lg = b.createLinearGradient(0, 0, 0, chh);
      lg.addColorStop(0, '#05070f'); lg.addColorStop(0.55, '#0b1330'); lg.addColorStop(1, '#131a3d');
      b.fillStyle = lg; b.fillRect(0, 0, cw, chh);
      b.globalCompositeOperation = 'lighter';
      for (var i = 0; i < 7; i++) {
        var x = rand(0, cw), y = rand(0, chh), r = rand(cw * 0.18, cw * 0.7);
        var rg2 = b.createRadialGradient(x, y, 0, x, y, r);
        var col = i % 2 ? pal.glow : pal.accent;
        rg2.addColorStop(0, hexA(col, 0.16)); rg2.addColorStop(0.55, hexA(col, 0.05)); rg2.addColorStop(1, hexA(col, 0));
        b.fillStyle = rg2; b.beginPath(); b.arc(x, y, r, 0, TAU); b.fill();
      }
      b.globalCompositeOperation = 'source-over';
    }
    return c;
  }

  function buildBackdrop(instant) {
    var key = BG_FOR_WAVE[(wave - 1) % BG_FOR_WAVE.length];
    if (instant) { bd.prev = null; bd.fade = 1; }
    else { bd.prev = bd.cur; bd.fade = 0; }
    bd.cur = makeBackdrop(key);
    bd.key = key;
  }

  // ================= 对象池 =================
  var particles = [], pIdx = 0;
  var bullets = [], bIdx = 0;
  var pickups = [], shocks = [], beams = [];

  function initPools() {
    particles = []; pIdx = 0; bullets = []; bIdx = 0;
    for (var i = 0; i < TUNE.maxParticles; i++) particles.push({ life: 0, x: 0, y: 0, vx: 0, vy: 0, r: 1, color: '#fff', max: 1 });
    for (var j = 0; j < TUNE.maxBullets; j++) bullets.push({ on: false, x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, r: 6, life: 0, near: false });
  }

  function emit(x, y, color, speed, life, size) {
    var p = particles[pIdx++ % TUNE.maxParticles];
    var a = rand(0, TAU), s = speed == null ? rand(40, 260) : speed;
    p.x = x; p.y = y;
    p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
    p.life = life == null ? rand(0.25, 0.8) : life;
    p.max = p.life;
    p.color = color; p.r = size == null ? rand(1, 2.6) : size;
  }

  function getBullet() {
    var tries = 0;
    while (tries++ < TUNE.maxBullets) {
      var b = bullets[bIdx++ % TUNE.maxBullets];
      if (!b.on) return b;
    }
    return null;
  }

  function killBullet(b) { b.on = false; }

  // ================= 游戏状态 =================
  var player = null;
  var state = 'menu';
  var score = 0, best = 0, timeAlive = 0, wave = 1, waveT = 0;
  var spawnT = 0, pickT = 0, shake = 0, flash = 0;
  var lives = TUNE.lives, invuln = TUNE.startInvuln;
  var combo = 1, comboT = 0, stats = { picks: 0, near: 0 };
  var nearCd = 0;
  var dragging = false, dragX = 0, dragY = 0;
  var keys = {};

  try { best = parseInt(localStorage.getItem('stardodge.best') || '0', 10) || 0; } catch (e) { best = 0; }

  function resetGame() {
    player = { x: W / 2, y: H * 0.72, r: 11, trail: [] };
    pickups = []; shocks = []; beams = [];
    for (var i = 0; i < bullets.length; i++) bullets[i].on = false;
    for (var j = 0; j < particles.length; j++) particles[j].life = 0;
    score = 0; timeAlive = 0; wave = 1; waveT = 0; spawnT = 0; pickT = 0.7;
    lives = TUNE.lives; invuln = TUNE.startInvuln;
    combo = 1; comboT = 0; shake = 0; flash = 0; nearCd = 0;
    stats = { picks: 0, near: 0 };
    pal = PALETTES[0];
    buildBackdrop(true);
    updateHearts();
  }

  function updateHearts() {
    var hs = $('hearts').children;
    for (var i = 0; i < hs.length; i++) hs[i].className = i < lives ? '' : 'off';
  }

  function setWave(w) {
    wave = w; waveT = 0;
    pal = PALETTES[(w - 1) % PALETTES.length];
    buildBackdrop(false);
    if (!Sound.sfx('wave', { dur: 0.8, gain: 0.55 })) {
      Sound.tone('triangle', 320, Sound.ctx ? Sound.ctx.currentTime : 0, 0.2, 0.1, Sound.sfxGain);
    }
    if (Sound.playing) Sound.select(w >= TUNE.battleFromWave ? 'battle' : 'calm');
  }


  function ring(x, y, color, r1) {
    shocks.push({ x: x, y: y, t: 0, life: 0.62, r0: 6, r1: r1 || 120, color: color });
    if (shocks.length > 24) shocks.shift();
  }

  function spawnBullet() {
    var mode = Math.random();
    var spd = Math.min(150 + wave * 16, 430) + Math.random() * 55;

    function add(x, y, vx, vy, r) {
      var b = getBullet(); if (!b) return;
      b.on = true; b.x = x; b.y = y; b.px = x; b.py = y;
      b.vx = vx; b.vy = vy; b.r = r; b.life = 0; b.near = false;
    }

    if (mode < 0.34) {
      var x = rand(30, W - 30), y = -20;
      var a = Math.atan2(player.y - y, player.x - x);
      add(x, y, Math.cos(a) * spd, Math.sin(a) * spd, 7);
    } else if (mode < 0.58) {
      var x2 = rand(W * 0.2, W * 0.8), y2 = -30, n = 7 + Math.min(wave, 6), base = rand(0, TAU);
      for (var i = 0; i < n; i++) {
        var aa = base + i / n * TAU;
        add(x2, y2, Math.cos(aa) * spd * 0.8, Math.sin(aa) * spd * 0.8 + 40, 6);
      }
    } else if (mode < 0.76) {
      var cx = W / 2, cy = -20, m = 5;
      for (var j = 0; j < m; j++) {
        var an = timeAlive * 1.6 + j / m * TAU;
        add(cx, cy, Math.cos(an) * spd * 0.55, Math.abs(Math.sin(an)) * spd * 0.5 + 90, 6);
      }
    } else if (mode < 0.9 && wave >= 2) {
      var fromLeft = Math.random() < 0.5;
      var bx = fromLeft ? -20 : W + 20, by = rand(H * 0.1, H * 0.55);
      var ang = Math.atan2(player.y - by, player.x - bx) + rand(-0.25, 0.25);
      for (var k = 0; k < 3; k++) add(bx, by + k * 16, Math.cos(ang) * spd, Math.sin(ang) * spd, 7);
    } else if (wave >= TUNE.battleFromWave) {
      beams.push({ x: rand(W * 0.15, W * 0.85), t: 0, warn: 0.85, life: 0.16 });
      Sound.sfx('laser', { dur: 0.9, gain: 0.45 });
    } else {
      var rx = rand(30, W - 30), ry = -20;
      add(rx, ry, rand(-40, 40), spd, 7);
    }
  }

  function hitPlayer() {
    if (invuln > 0) return;
    if (lives > 1) {
      lives--;
      invuln = TUNE.invulnAfterHit;
      flash = 0.6; shake = 14;
      combo = 1; comboT = 0;
      updateHearts();
      ring(player.x, player.y, '#ff5e7a', 140);
      for (var i = 0; i < 26; i++) emit(player.x, player.y, i % 3 ? '#ff5e7a' : '#ffd166');
      if (!Sound.sfx('hit', { dur: 1.0, gain: 0.55, rate: 1.15 })) Sound.noise(0, 0.4, 0.4, 300, Sound.sfxGain);
    } else {
      die();
    }
  }

  function die() {
    state = 'over';
    score = Math.floor(score + timeAlive * 10);
    for (var k = 0; k < 46; k++) emit(player.x, player.y, k % 3 ? '#ff5e7a' : '#ffd166');
    ring(player.x, player.y, '#ffd166', 220);
    shake = 18; flash = 1;
    if (!Sound.sfx('hit', { dur: 1.8, gain: 0.9 })) Sound.noise(0, 0.5, 0.5, 300, Sound.sfxGain);
    Sound.stopMusic();
    if (score > best) {
      best = score;
      try { localStorage.setItem('stardodge.best', String(best)); } catch (e) {}
    }
    $('finalScore').textContent = String(score);
    $('finalBest').textContent = '最高分 ' + best;
    $('finalStats').textContent = '第 ' + wave + ' 波 · 拾取 ' + stats.picks + ' · 擦弹 ' + stats.near;
    $('hud').classList.add('hidden');
    $('over').hidden = false;
  }

  function update(dt) {
    timeAlive += dt; waveT += dt;

    if (waveT >= TUNE.waveSeconds) setWave(wave + 1);

    // 移动
    var speed = TUNE.playerSpeed;
    var kx = 0, ky = 0;
    if (keys.left) kx -= 1;
    if (keys.right) kx += 1;
    if (keys.up) ky -= 1;
    if (keys.down) ky += 1;
    if (kx || ky) {
      var L = Math.hypot(kx, ky) || 1;
      player.x += kx / L * speed * dt;
      player.y += ky / L * speed * dt;
    }
    player.x = clamp(player.x, player.r + 4, W - player.r - 4);
    player.y = clamp(player.y, player.r + 4, H - player.r - 4);

    if (invuln > 0) invuln = Math.max(0, invuln - dt);
    player.trail.push({ x: player.x, y: player.y });
    if (player.trail.length > 10) player.trail.shift();

    // 生成
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnBullet();
      spawnT = Math.max(0.15, 0.62 - wave * 0.045);
    }

    nearCd = Math.max(0, nearCd - dt);

    var i, b;
    for (i = 0; i < bullets.length; i++) {
      b = bullets[i];
      if (!b.on) continue;
      b.life += dt;
      b.px = b.x; b.py = b.y;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -70 || b.x > W + 70 || b.y < -90 || b.y > H + 90) { b.on = false; continue; }

      var d = Math.hypot(b.x - player.x, b.y - player.y);
      if (d < b.r + player.r * 0.78) { hitPlayer(); if (state !== 'play') return; continue; }
      if (!b.near && d < b.r + player.r + TUNE.nearMissPad) {
        b.near = true;
        stats.near++;
        score += TUNE.nearMissScore * combo;
        emit(player.x, player.y, pal.glow, rand(30, 90), 0.3, 1.4);
        if (nearCd <= 0) {
          nearCd = TUNE.nearMissCooldown;
          Sound.sfx('pickup', { dur: 0.12, gain: 0.14, rate: 1.9, offset: 0.02 });
        }
      }
    }

    for (i = beams.length - 1; i >= 0; i--) {
      var bm = beams[i];
      bm.t += dt;
      if (bm.t > bm.warn && bm.t < bm.warn + bm.life) {
        if (Math.abs(player.x - bm.x) < 16 + player.r * 0.7) { hitPlayer(); if (state !== 'play') return; }
      }
      if (bm.t > bm.warn + bm.life + 0.14) beams.splice(i, 1);
    }

    // 星星
    pickT -= dt;
    if (pickT <= 0) {
      pickT = rand(0.9, 1.8);
      pickups.push({ x: rand(30, W - 30), y: rand(H * 0.15, H * 0.75), r: 9, t: 0 });
    }
    for (i = pickups.length - 1; i >= 0; i--) {
      var s = pickups[i];
      s.t += dt;
      var dd = Math.hypot(s.x - player.x, s.y - player.y);
      if (dd < TUNE.magnetRadius) {
        var pull = (1 - dd / TUNE.magnetRadius) * 260 * dt;
        s.x += (player.x - s.x) / Math.max(dd, 1) * pull * 3;
        s.y += (player.y - s.y) / Math.max(dd, 1) * pull * 3;
      }
      if (dd < s.r + player.r + 2) {
        pickups.splice(i, 1);
        stats.picks++;
        score += TUNE.pickupScore * combo;
        comboT = TUNE.comboWindow;
        if (stats.picks % TUNE.comboStep === 0) combo = Math.min(TUNE.comboMax, combo + 1);
        if (!Sound.sfx('pickup', { dur: 0.6, gain: 0.45 })) Sound.tone('square', 880 + combo * 60, 0, 0.06, 0.16, Sound.sfxGain);
        for (var p = 0; p < 10; p++) emit(s.x, s.y, '#ffe18c', rand(40, 150), 0.5, 1.8);
        ring(s.x, s.y, '#ffe18c', 52);
      } else if (s.t > 7) {
        pickups.splice(i, 1);
      }
    }

    // 连击衰减
    if (comboT > 0) {
      comboT -= dt;
      if (comboT <= 0) combo = 1;
    }

    // 粒子
    for (i = 0; i < particles.length; i++) {
      var pt = particles[i];
      if (pt.life <= 0) continue;
      pt.life -= dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.97; pt.vy *= 0.97;
    }

    // 冲击环
    for (i = shocks.length - 1; i >= 0; i--) {
      shocks[i].t += dt;
      if (shocks[i].t > shocks[i].life) shocks.splice(i, 1);
    }

    shake = Math.max(0, shake - dt * 44);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.4);

    // HUD
    $('score').textContent = String(Math.floor(score + timeAlive * 10));
    $('combo').textContent = 'x' + combo;
    $('combo').className = combo > 1 ? 'on' : '';
    $('meta').textContent = 'WAVE ' + wave + ' · ' + timeAlive.toFixed(1) + 's';
    $('wavefill').style.width = Math.min(100, waveT / TUNE.waveSeconds * 100) + '%';
    $('flash').style.opacity = flash > 0.05 ? String(flash * 0.55) : '0';
  }

  function drawShip() {
    var i;
    for (i = 0; i < player.trail.length; i++) {
      var tp = player.trail[i];
      ctx.fillStyle = hexA(pal.glow, i / player.trail.length * 0.3);
      ctx.beginPath(); ctx.arc(tp.x, tp.y + 6, 3 + i * 0.5, 0, TAU); ctx.fill();
    }
    var g = player.r * 5;
    var pulse = 1 + 0.06 * Math.sin(performance.now() / 220);
    ctx.drawImage(sprite.glow, player.x - g * pulse / 2, player.y - g * pulse / 2, g * pulse, g * pulse);

    // 受击无敌时的护盾环
    if (invuln > 0) {
      var a = 0.25 + 0.35 * Math.abs(Math.sin(performance.now() / 120));
      ctx.strokeStyle = hexA(pal.glow, a);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 9 + Math.sin(performance.now() / 260) * 1.6, 0, TAU); ctx.stroke();
    }

    var flick = invuln > 0 ? (Math.floor(invuln * 14) % 2 === 0 ? 0.45 : 1) : 1;
    ctx.globalAlpha = flick;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.beginPath();
    ctx.moveTo(0, -player.r * 1.5);
    ctx.lineTo(player.r, player.r * 1.1);
    ctx.lineTo(0, player.r * 0.5);
    ctx.lineTo(-player.r, player.r * 1.1);
    ctx.closePath();
    ctx.fillStyle = '#f4fbff'; ctx.fill();
    ctx.strokeStyle = pal.glow; ctx.lineWidth = 1.6; ctx.stroke();
    var fl = 6 + Math.random() * 8;
    ctx.beginPath();
    ctx.moveTo(-4, player.r * 0.8); ctx.lineTo(0, player.r + fl); ctx.lineTo(4, player.r * 0.8);
    ctx.closePath();
    ctx.fillStyle = hexA(pal.accent, 0.9); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function render(dt) {
    ctx.save();
    if (shake > 0.2) ctx.translate(rand(-shake, shake) * 0.35, rand(-shake, shake) * 0.35);

    // 背景交叉淡入
    var pad = 14, ox = 0, oy = 0;
    if (player) {
      ox = (player.x / W - 0.5) * 10;
      oy = (player.y / H - 0.5) * 8;
    }
    if (bd.prev && bd.fade < 1) {
      ctx.drawImage(bd.prev, -pad - ox, -pad - oy, W + pad * 2, H + pad * 2);
      bd.fade = Math.min(1, bd.fade + dt / 0.9);
      ctx.globalAlpha = bd.fade;
      if (bd.cur) ctx.drawImage(bd.cur, -pad - ox, -pad - oy, W + pad * 2, H + pad * 2);
      ctx.globalAlpha = 1;
    } else if (bd.cur) {
      ctx.drawImage(bd.cur, -pad - ox, -pad - oy, W + pad * 2, H + pad * 2);
    }

    // 星点
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += s.v * dt * (state === 'play' ? 1 : 0.28);
      if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; }
      s.tw += dt * 2;
      ctx.fillStyle = hexA(pal.star, s.a * (0.7 + 0.3 * Math.sin(s.tw)));
      ctx.fillRect(s.x, s.y, s.r, s.r * (1 + s.v / 220));
    }

    var j;
    if (state === 'play' || state === 'over' || state === 'paused') {
      for (j = 0; j < beams.length; j++) {
        var bm = beams[j];
        var warnPhase = bm.t < bm.warn;
        var a2 = warnPhase ? 0.2 + 0.24 * Math.abs(Math.sin(bm.t * 14)) : 0.92;
        ctx.fillStyle = hexA('#ff5e7a', a2);
        if (warnPhase) ctx.fillRect(bm.x - 2, 0, 4, H);
        else ctx.fillRect(bm.x - 15, 0, 30, H);
      }

      for (j = 0; j < pickups.length; j++) {
        var pk = pickups[j];
        var sz = pk.r * 3.2 * (1 + 0.12 * Math.sin(pk.t * 6));
        ctx.drawImage(sprite.star, pk.x - sz / 2, pk.y - sz / 2, sz, sz);
      }

      for (j = 0; j < bullets.length; j++) {
        var b = bullets[j];
        if (!b.on) continue;
        var fadeIn = Math.min(1, b.life / 0.12);
        ctx.globalAlpha = fadeIn;
        // 拖尾
        ctx.strokeStyle = hexA(pal.accent, 0.5);
        ctx.lineWidth = b.r * 0.8;
        ctx.beginPath(); ctx.moveTo(b.px, b.py); ctx.lineTo(b.x, b.y); ctx.stroke();
        var bs = b.r * 4.2;
        ctx.drawImage(sprite.bullet, b.x - bs / 2, b.y - bs / 2, bs, bs);
        ctx.fillStyle = 'rgba(255,245,248,.95)';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.55, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // 冲击环
    for (j = 0; j < shocks.length; j++) {
      var sk = shocks[j];
      var t = sk.t / sk.life;
      var rr = lerp(sk.r0, sk.r1, t);
      ctx.strokeStyle = hexA(sk.color, (1 - t) * 0.8);
      ctx.lineWidth = Math.max(1, 4 * (1 - t));
      ctx.beginPath(); ctx.arc(sk.x, sk.y, rr, 0, TAU); ctx.stroke();
    }

    // 粒子
    for (j = 0; j < particles.length; j++) {
      var p = particles[j];
      if (p.life <= 0) continue;
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (player && (state === 'play' || state === 'over' || state === 'paused')) drawShip();
    ctx.restore();
  }

  // ================= 主循环（固定步长） =================
  var STEP = 1 / 120, acc = 0, lastT = 0, fpsT = 0, fpsN = 0, fps = 0;

  function loop(now) {
    requestAnimationFrame(loop);
    var t = now / 1000;
    var dt = lastT ? t - lastT : 0;
    lastT = t;
    if (dt > 0.1) dt = 0.1;

    fpsT += dt; fpsN++;
    if (fpsT >= 0.5) { fps = Math.round(fpsN / fpsT); fpsT = 0; fpsN = 0; if ($('dbg').classList.contains('on')) dbg('fps ' + fps + ' · 音乐 ' + (Sound.tracks.battle && Sound.tracks.battle.gain.gain.value > 0.5 ? 'battle' : 'calm') + ' · 图片 ' + Assets.imgOk + '/' + IMAGES.length + ' · 音频 ' + Assets.bufOk + '/' + SOUNDS.length); }

    if (state === 'play') {
      acc += dt;
      var guard = 0;
      while (acc >= STEP && guard++ < 8) { update(STEP); acc -= STEP; if (state !== 'play') break; }
    } else {
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        if (p.life <= 0) continue;
        p.life -= dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= 0.98; p.vy *= 0.98;
      }
      if (flash > 0) { flash = Math.max(0, flash - dt * 2.4); $('flash').style.opacity = String(flash * 0.5); }
    }
    render(dt);
  }

  // ================= 星空与尺寸 =================
  var stars = [];
  function buildStars() {
    var count = clamp(Math.round(W * H / 7000), 60, 240);
    stars = [];
    for (var i = 0; i < count; i++) {
      var layer = i % 3;
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: 0.5 + layer * 0.55 + Math.random() * 0.5,
        v: 9 + layer * 26 + Math.random() * 10,
        a: 0.25 + layer * 0.22 + Math.random() * 0.2,
        tw: Math.random() * TAU
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, TUNE.dprCap);
    W = canvas.clientWidth || window.innerWidth;
    H = canvas.clientHeight || window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars();
    buildBackdrop(true);
    if (player) { player.x = clamp(player.x, 24, W - 24); player.y = clamp(player.y, 24, H - 24); }
  }

  // ================= 输入 =================
  function pos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  canvas.addEventListener('pointerdown', function (e) {
    Sound.unlock();
    if (state !== 'play') return;
    dragging = true;
    var p = pos(e); dragX = p.x; dragY = p.y;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging || state !== 'play') return;
    var p = pos(e);
    var dx = (p.x - dragX) * TUNE.dragSens;
    var dy = (p.y - dragY) * TUNE.dragSens;
    dragX = p.x; dragY = p.y;
    player.x = clamp(player.x + dx, player.r + 4, W - player.r - 4);
    player.y = clamp(player.y + dy, player.r + 4, H - player.r - 4);
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('pointerup', function () { dragging = false; });
  window.addEventListener('pointercancel', function () { dragging = false; });

  var KEYMAP = { arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right', arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down' };
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (KEYMAP[k]) { keys[KEYMAP[k]] = true; e.preventDefault(); }
    if (k === ' ' ) {
      if (state === 'menu' || state === 'over') start();
      else if (state === 'play') pauseGame();
      else if (state === 'paused') resumeGame();
      e.preventDefault();
    }
    if (k === 'p' && state === 'play') pauseGame();
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key.toLowerCase();
    if (KEYMAP[k]) keys[KEYMAP[k]] = false;
  });

  // ================= 流程 =================
  function start() {
    Sound.unlock();
    resetGame();
    state = 'play';
    $('menu').hidden = true;
    $('over').hidden = true;
    $('paused').hidden = true;
    $('hud').classList.remove('hidden');
    $('score').textContent = '0';
    lastT = 0; acc = 0;
    Sound.startMusic('calm');
  }

  function pauseGame() {
    if (state !== 'play') return;
    state = 'paused';
    dragging = false;
    Sound.stopMusic();
    $('paused').hidden = false;
  }

  function resumeGame() {
    if (state !== 'paused') return;
    state = 'play';
    lastT = 0; acc = 0;
    $('paused').hidden = true;
    Sound.startMusic(wave >= TUNE.battleFromWave ? 'battle' : 'calm');
  }

  $('start').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('resume').addEventListener('click', resumeGame);
  $('quit').addEventListener('click', start);
  $('over').addEventListener('pointerdown', function (e) { if (e.target === $('over')) start(); });
  $('pause').addEventListener('click', function (e) { e.stopPropagation(); pauseGame(); });
  $('mute').addEventListener('click', function (e) {
    e.stopPropagation();
    var m = Sound.toggleMute();
    $('mute').classList.toggle('off', m);
    $('mute').textContent = m ? '✕' : '♪';
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'play') pauseGame();
  });

  // ================= 启动 =================
  buildSprites();
  initPools();
  resize();
  if (player === null) player = { x: W / 2, y: H * 0.72, r: 11, trail: [] };
  $('menuBest').textContent = '最高分 ' + best;
  for (var q = 0; q < 26; q++) emit(rand(0, W), rand(0, H), q % 3 ? '#4fc3f7' : '#ff5e7a', rand(10, 40), rand(1, 3), 1.8);
  noteProgress();
  loadAll().then(function () {
    if (state !== 'play') buildBackdrop(true);
    if (state === 'play' && !Sound.tracks.calm && !Sound.tracks.battle) {
      Sound.stopSynth(); Sound.startMusic(wave >= TUNE.battleFromWave ? 'battle' : 'calm');
    }
    if (/[?&]demo/.test(location.search)) start();
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
